# npm dependency updates. Minor and patch updates arrive as one grouped PR a
# week; .github/workflows/dependency-updates.yml tests it, squash-merges it and
# deploys. Security fixes arrive as one grouped PR too, as soon as GitHub knows
# about them. Major updates are left out on purpose: they need a person.
version: 2
# One entry for the whole pnpm workspace, on purpose: an entry pointed at a
# package folder (packages/client, ...) changes only that package.json and
# never the root pnpm-lock.yaml, so its PRs fail a frozen install. The one-off
# catch-up of 2026-11-07 cleared the backlog that would run this job past its
# time limit; a week of updates fits.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Etc/UTC
    # A new release waits a week before it is proposed, so a hijacked or broken
    # version has time to be pulled first. Security updates skip the wait.
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # 0.x packages: a "minor" bump is a breaking release under semver.
      # pdfkit draws the invoices; sharp and esbuild build images and bundles.
      - dependency-name: "pdfkit"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "@types/pdfkit"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "sharp"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "esbuild"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "uqr"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "class-variance-authority"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "@hatchkit/dev-plugin-next"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "@types/chrome"
        update-types: ["version-update:semver-minor"]
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      npm-security:
        applies-to: security-updates
        update-types: [minor, patch]
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
