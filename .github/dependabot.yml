# npm dependency updates. Minor and patch updates arrive as one grouped PR a
# week; .github/workflows/dependency-updates.yml tests it, squash-merges it and
# deploys. Security fixes arrive as one grouped PR too, as soon as GitHub knows
# about them. Major updates are left out on purpose: they need a person.
version: 2
# One entry per workspace package: Dependabot checks every dependency one at
# a time, and in a workspace this size each update costs pnpm tens of seconds,
# so one job for the whole tree can run past Dependabot's time limit. Each
# entry is its own job and its own grouped PR; all share the root
# pnpm-lock.yaml.
updates:
  - package-ecosystem: npm
    directory: /
    # The root manifest only; the packages below have their own entries.
    exclude-paths:
      - "packages/**"
      - "docs-site/**"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Etc/UTC
    # A new release waits a week before it is proposed, so a hijacked or broken
    # version has time to be pulled first. Security updates skip the wait.
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # 0.x packages: a "minor" bump is a breaking release under semver.
      # pdfkit draws the invoices; sharp and esbuild build images and bundles.
      - dependency-name: "pdfkit"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "@types/pdfkit"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "sharp"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "esbuild"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "uqr"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "class-variance-authority"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "@hatchkit/dev-plugin-next"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "@types/chrome"
        update-types: ["version-update:semver-minor"]
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      npm-security:
        applies-to: security-updates
        update-types: [minor, patch]
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
