name: dependency-updates

# Lands Dependabot's grouped minor/patch and security PRs (see
# .github/dependabot.yml): runs the same checks as the push pipeline on the PR,
# squash-merges it, and starts build-and-deploy on main. A merge made with
# GITHUB_TOKEN does not trigger push workflows, so the deploy is started
# explicitly. One PR per run; the next run takes the next one after Dependabot
# rebases it.
#
# Never lands: a major update, an ungrouped PR, a PR with a commit that is not
# Dependabot's, or a PR whose checks fail. Those stay open for a person.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

concurrency:
  group: dependency-updates
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pick:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      statuses: read
    outputs:
      number: ${{ steps.pick.outputs.number }}
      sha: ${{ steps.pick.outputs.sha }}
    steps:
      - name: Pick the oldest grouped Dependabot PR not already tested red
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # A head commit this workflow already tested red carries a failed
          # "dependency-updates" status. It is skipped, so one broken PR does not
          # hold the queue; Dependabot pushing a new head tests it again.
          prs=$(gh pr list --repo "$REPO" --state open --author app/dependabot --base main \
                  --json number,headRefName,headRefOid,createdAt \
                  --jq '[.[] | select(.headRefName | test("^dependabot/npm_and_yarn/(.+/)?npm-(minor-patch|security)-"))] | sort_by(.createdAt) | .[] | "\(.number) \(.headRefOid)"')
          while read -r number sha; do
            [ -n "$number" ] || continue
            state=$(gh api "repos/$REPO/commits/$sha/statuses" \
                      --jq '[.[] | select(.context == "dependency-updates")][0].state // ""')
            if [ "$state" = "failure" ]; then echo "PR #$number at $sha failed before: skipped"; continue; fi
            others=$(gh pr view "$number" --repo "$REPO" --json commits \
                       --jq '[.commits[].authors[].login | select(. != "dependabot[bot]")] | length')
            if [ "$others" != "0" ]; then
              echo "::warning::PR #$number has commits that are not Dependabot's: left for a person"; continue
            fi
            echo "PR #$number at $sha"
            echo "number=$number" >> "$GITHUB_OUTPUT"
            echo "sha=$sha" >> "$GITHUB_OUTPUT"
            exit 0
          done <<<"$prs"
          echo "no grouped Dependabot PR is left to test"

  # The same gates as build-and-deploy.yml: verify, e2e and desktop. They run
  # the PR's code with a read-only token and no secrets.
  verify:
    needs: [pick]
    if: needs.pick.outputs.number != ''
    runs-on: ubuntu-latest
    # The workflow-level block grants `packages: write` for the two image
    # pushes. This job pins `contents: read` instead, so PR code never runs
    # with a token that can publish a package. (A fork PR gets a read-only
    # token regardless; this covers same-repo branch PRs too.)
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.pick.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      # `pnpm run build` compiles shared -> core -> server -> client, which
      # leaves packages/extension, packages/raycast and electron/ untypechecked
      # — they are not in the build graph at all. A change that breaks the
      # browser extension, the Raycast extension or the Electron main process
      # would otherwise go green through the entire pipeline.
      - run: pnpm run typecheck
      # Before the build, so a lint failure costs seconds rather than the full
      # compile. This is the only place eslint is enforced for everyone: the
      # husky pre-push hook runs the same `pnpm run lint`, but a hook lives in
      # a working copy and `--no-verify` skips it, so CI is what keeps the
      # backlog from growing back.
      - run: pnpm run lint
      - run: pnpm run build
      # Approval locks, durable entry replay (`entries.applyOperation`, which
      # every web and desktop entry write takes) and invoice deletion commit in
      # transactions, which a standalone mongod refuses. Their cases skip on
      # one, so the unit suite runs against a single-node replica set.
      - run: bash scripts/mongo-replica-set-container.sh mongo-unit-rs 27020
      - run: pnpm run test:unit
        env:
          # The scheduler's lease, the runaway-reminder job and the cases above
          # are tested against a real database; those files skip without this.
          TEST_MONGODB_URI: mongodb://127.0.0.1:27020
          # Turns those skips into failures: a lost URI or a standalone server
          # must fail the run, not pass it with the riskiest cases unrun.
          REQUIRE_TRANSACTIONS: "1"
      # No standalone-mongod pass any more: since storage quotas (7e8d4a21)
      # every workspace write runs in a transaction and a standalone server
      # refuses it, so the fallback paths that pass exercised are unreachable.
      # docs/storage-limits.md: a replica set or mongos is required.
      - run: pnpm run test:client
      # The client image builds the docs into out/docs/ (packages/client/Dockerfile),
      # but that only runs on a push to main, after merge. Building them here
      # too puts a broken docs link (`onBrokenLinks: "throw"`) or a noindex
      # page in front of the pull request instead.
      - run: node scripts/docs/build-into-client.mjs

  e2e:
    needs: [pick, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      # Mongo is not a service here: entry writes need a replica set, and a
      # service container cannot take `--replSet`. The step below starts one.
      redis-e2e:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.pick.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      # start-server.sh's own Mongo readiness loop is inside an
      # `if [ -z "${CI:-}" ]` guard, so under CI nothing else waits for Mongo;
      # the script returns only once the member is a writable primary.
      - run: bash scripts/mongo-replica-set-container.sh mongo-e2e 27018
      - run: pnpm run build

      - run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npx playwright test
        env:
          CI: "true"
          MONGODB_URI: mongodb://127.0.0.1:27018/starter-e2e
          REDIS_URL: redis://127.0.0.1:6380
          BETTER_AUTH_SECRET: e2e-test-secret
          BETTER_AUTH_URL: http://127.0.0.1:5006
          FRONTEND_URL: http://127.0.0.1:3001

  desktop:
    needs: [pick, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.pick.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      # A replica set, as in the e2e job: entry writes need transactions.
      - run: bash scripts/mongo-replica-set-container.sh mongo-desktop 27019
      # shared and core are what the API and the client import from dist/.
      - run: pnpm --filter @starter/shared run build && pnpm --filter @starter/core run build
      # Electron 42 has no install script; the binary arrives only when asked.
      - run: pnpm run electron:ensure
      # Chromium's shared libraries for the Electron binary.
      - run: npx playwright install-deps chromium
      # Ubuntu 24.04's AppArmor forbids the unprivileged user namespaces
      # Chromium's sandbox needs, and Electron aborts at launch without them.
      # Lifting that on the throwaway runner keeps `sandbox: true` in force
      # under test instead of launching with --no-sandbox.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Run the desktop harness
        run: xvfb-run --auto-servernum -- pnpm run test:e2e:desktop
        env:
          CI: "true"
          MONGODB_URI: mongodb://127.0.0.1:27019/trackyourtime-desktop-e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: desktop-e2e-results
          path: test-results/
          if-no-files-found: ignore

  record:
    needs: [pick, verify, e2e, desktop]
    if: always() && needs.pick.outputs.number != ''
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Record the result on the PR's head commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ needs.pick.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PASSED: ${{ needs.verify.result == 'success' && needs.e2e.result == 'success' && needs.desktop.result == 'success' }}
        run: |
          if [ "$PASSED" = "true" ]; then state=success; text="push pipeline checks passed"
          else state=failure; text="push pipeline checks failed: left for a person"; fi
          gh api -X POST "repos/$REPO/statuses/$SHA" -f state="$state" -f context=dependency-updates \
            -f description="$text" -f target_url="$RUN_URL" >/dev/null
          echo "$SHA: $state"

  land:
    needs: [pick, verify, e2e, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Squash-merge the tested commit and deploy main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ needs.pick.outputs.number }}
          SHA: ${{ needs.pick.outputs.sha }}
        run: |
          # --match-head-commit refuses if Dependabot pushed again after the tests.
          gh pr merge "$NUMBER" --repo "$REPO" --squash --delete-branch --match-head-commit "$SHA"
          gh workflow run build-and-deploy.yml --repo "$REPO" --ref main
          echo "merged #$NUMBER and started build-and-deploy on main"
