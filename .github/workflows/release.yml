# Publishes multi-arch, version-tagged images for self-hosters.
#
# ADDITIVE — this workflow deploys nothing and changes nothing about the
# owner's setup. The Coolify production deploy still runs from
# build-and-deploy.yml on every push to main, still builds linux/amd64 only,
# and still publishes the `:main` / `:<sha>` tags it always has. Nothing here
# touches those tags or that pipeline.
#
# Two images come out of a release, and they are NOT the same two images
# build-and-deploy.yml produces:
#
#   ghcr.io/<owner>/<repo>-server            same Dockerfile as the deploy
#                                            workflow, now also built for
#                                            arm64 and tagged by version.
#
#   ghcr.io/<owner>/<repo>-client-selfhost   a DIFFERENT BUILD of the client
#                                            from the deploy workflow's
#                                            `-client` image, under a
#                                            deliberately different package
#                                            name.
#
# The client name is separate because NEXT_PUBLIC_* values are inlined into
# the browser bundle at image BUILD time, so a client image is permanently
# bound to whatever API origin it was built against. build-and-deploy.yml
# bakes the owner's api.<domain> into `-client`; this workflow builds with an
# EMPTY NEXT_PUBLIC_API_URL so the browser falls back to its own origin and
# the image works behind any domain, given a reverse proxy that routes /api/*
# and /ws to the server container. Those two builds cannot share a package:
# publishing them side by side would mean `-client:latest` and `-client:main`
# silently talk to different hosts, and a self-hoster who pulled the wrong one
# would get a login screen that posts to a domain they do not own. The suffix
# makes the distinction impossible to get wrong at `docker pull` time.
#
# Analytics build args are deliberately omitted, not passed empty: with
# NEXT_PUBLIC_OPENPANEL_CLIENT_ID and NEXT_PUBLIC_PLAUSIBLE_DOMAIN unset the
# client emits no third-party script tags at all, so a self-hosted instance
# makes no outbound request the operator did not ask for.
#
# A `v*` tag runs THIS workflow, extension-release.yml (the Chrome Web Store
# upload, which only uploads an artifact while its secrets are unset),
# desktop-release.yml (every desktop channel into a DRAFT GitHub Release;
# publishing it is the release) and mobile-release.yml (Play and TestFlight;
# with no secrets it builds nothing and ends with a notice).
# build-and-deploy.yml runs on pushes to main and on pull requests.
#
# ── Jobs, in order ───────────────────────────────────────────────────────
#
#   prepare    resolves the version, the commit, and which tags may move.
#   release-*  one leg per image per arch, each on a NATIVE runner
#              (ubuntu-24.04 / ubuntu-24.04-arm), pushed by digest only — no
#              tag exists yet. A dispatch with `push` unchecked stops here: it
#              builds both images on both arches and discards the result,
#              which is the only way to test this file without publishing.
#   merge      joins the two digests of each image into one manifest list and
#              pushes the EXACT tag (vX.Y.Z) and nothing else.
#   smoke      pulls that exact tag ANONYMOUSLY on amd64 and on arm64, starts
#              docker-compose.selfhost.yml from the tagged commit, and checks
#              /api/health, the web app and the proxy's /api routing
#              (scripts/verify-release-images.sh — the same script the
#              maintainer runs locally, see docs/releasing.md).
#   promote    moves `X.Y` and `latest` onto the exact tag, only once smoke
#              has passed on both arches. A broken image, or one nobody can
#              pull because its package is still private, never becomes what
#              `latest` points at.
#
# See docs/releasing.md for the maintainer's runbook, including the one
# manual step of the FIRST release (making trackyourtime-client-selfhost public).

name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "vX.Y.Z to (re-)publish. Required when push is checked; empty builds the dispatched branch"
        required: false
        type: string
        default: ""
      push:
        description: "Push to GHCR. Unchecked builds both images on both arches and discards the result"
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

# Read-only by default. `packages: write` is granted per job, to the build,
# merge and promote jobs only — never to smoke, whose whole point is to prove
# the images can be pulled by someone holding no token at all.
# Image names are spelled out, never derived from the repository name. A
# repository rename would otherwise move every push to a new GHCR package —
# which GHCR creates private — while Coolify and self-hosters keep pulling the
# old name. Renaming the repo must not rename the images as a side effect.
env:
  IMAGE_OWNER_REPO: trebeljahr/trackyourtime

permissions:
  contents: read

jobs:
  # Resolves one version string and one commit for every later job, so a
  # manual re-cut publishes the same tags a pushed tag would, and all four
  # build legs compile the same commit even if the tag were moved mid-run.
  # On workflow_dispatch github.ref_name is a BRANCH and github.sha is that
  # branch's head — hence the explicit input and the resolved `sha` output
  # that every checkout and every revision label below uses instead.
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      push: ${{ steps.resolve.outputs.push }}
      version: ${{ steps.resolve.outputs.version }}
      sha: ${{ steps.resolve.outputs.sha }}
      latest: ${{ steps.resolve.outputs.latest }}
      minor: ${{ steps.resolve.outputs.minor }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          # Full history AND tags: the latest/minor decision below compares
          # this version against every other release tag.
          fetch-depth: 0

      - id: resolve
        env:
          # The push event carries no inputs, so a pushed tag always publishes
          # — nothing a dispatch form says can weaken the tag path.
          PUSH: ${{ github.event_name == 'push' || inputs.push == true }}
          RAW_VERSION: ${{ inputs.tag || (github.event_name == 'push' && github.ref_name) || '' }}
        run: |
          set -euo pipefail
          version="$RAW_VERSION"
          sha="$(git rev-parse HEAD)"
          latest=false
          minor=""

          if [ "$PUSH" = "true" ]; then
            if [ -z "$version" ]; then
              echo "::error::push is checked but no tag was given. Publishing needs an existing vX.Y.Z tag."
              exit 1
            fi
            if ! printf '%s' "$version" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
              echo "::error::'$version' is not a vX.Y.Z tag. Release images are version-tagged; refusing to publish an unversioned one."
              exit 1
            fi
            # A prerelease (v1.2.3-rc.1) gets its exact tag and nothing else.
            # Moving `:latest` onto it would hand every self-hoster tracking
            # latest an unfinished build without them doing anything.
            case "$version" in
              *-*) ;;
              *)
                # A stable release moves a floating tag only when it is the
                # newest stable release that tag covers. Without this, a
                # dispatch re-publishing v0.1.0 after v0.2.0 exists would move
                # `latest` BACKWARDS, and a hotfix v0.1.5 would drag `latest`
                # off 0.2 while rightly moving `0.1`.
                series="$(printf '%s' "$version" | sed -E 's/^v([0-9]+)\.([0-9]+)\..*/\1.\2/')"
                stable="$(git tag -l 'v*' | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sort -V)"
                newest="$(printf '%s\n' "$stable" | tail -n 1)"
                newest_in_series="$(printf '%s\n' "$stable" | { grep -F "v${series}." || true; } | tail -n 1)"
                if [ "$version" = "$newest" ]; then latest=true; fi
                if [ "$version" = "$newest_in_series" ]; then minor="$series"; fi
                ;;
            esac
          else
            # Dry run: the version only names the build in labels and logs.
            version="${version:-dryrun-$(git rev-parse --short HEAD)}"
          fi

          {
            echo "push=$PUSH"
            echo "version=$version"
            echo "sha=$sha"
            echo "latest=$latest"
            echo "minor=$minor"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $version at $sha (push=$PUSH, latest=$latest, minor=${minor:-none})"

      # The version number must say what changed: a new API level or a
      # migration is at least a minor release, a raised API-level floor or a
      # migration the previous release cannot read is a major one, and the
      # CHANGELOG and release notes must exist. Before any build, so a tag that
      # understates its changes publishes nothing. A dry run has no version to
      # check. See docs/versioning.md → Release numbers.
      - name: Check the version bump against API and schema changes
        if: steps.resolve.outputs.push == 'true'
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: node scripts/release-policy-check.mjs "$VERSION" HEAD

  release-server:
    needs: [prepare]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      # Both legs always finish, so one run tells you whether the failure is
      # arch-specific rather than hiding the other half behind a cancel.
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: needs.prepare.outputs.push == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Labels only: this leg pushes by digest and applies no tag. The tag is
      # written once, by `merge`, onto the joined manifest list. `revision`
      # and `version` are set by hand because metadata-action reads them from
      # the event, which on a dispatch is the dispatching branch.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_OWNER_REPO }}-server
          flavor: latest=false
          tags: type=raw,value=${{ needs.prepare.outputs.version }}
          labels: |
            org.opencontainers.image.title=trackyourtime-server
            org.opencontainers.image.description=Track Your Time API server
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.sha }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/server/Dockerfile
          # Native runners, one arch each — no QEMU. Emulated arm64 made the
          # install and tsc steps several times slower, and Node native
          # binaries under emulation have a history of hanging or dying with
          # SIGILL; the first run to find out would have been a release tag.
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # /api/health reports this as `version`, so an operator can tell
          # which commit a running release is — the deploy workflow passes it
          # too, and a release image without it answered an empty string.
          build-args: |
            COMMIT_SHA=${{ needs.prepare.outputs.sha }}
          # Publishing: push the image by DIGEST, untagged, for `merge` to
          # join. Dry run: `cacheonly` builds everything and keeps nothing but
          # the layer cache.
          outputs: ${{ needs.prepare.outputs.push == 'true' && format('type=image,name=ghcr.io/{0}-server,push-by-digest=true,name-canonical=true,push=true', env.IMAGE_OWNER_REPO) || 'type=cacheonly' }}
          # Explicit rather than build-push-action's implicit default, and
          # mode=max is safe here: no secret and no API URL is a build arg, so
          # the recorded build parameters disclose nothing. Off on a dry run,
          # where there is no image to attach an attestation to.
          provenance: ${{ needs.prepare.outputs.push == 'true' && 'mode=max' || 'false' }}
          sbom: ${{ needs.prepare.outputs.push == 'true' }}
          # One cache scope per arch, or the two legs overwrite each other's
          # cache on every run. A tag run can restore caches written on the
          # default branch, so a dry-run dispatch on main warms the cache the
          # real release then reads.
          cache-from: type=gha,scope=release-server-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-server-${{ matrix.arch }}

      - name: Export digest
        if: needs.prepare.outputs.push == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v4
        if: needs.prepare.outputs.push == 'true'
        with:
          name: digests-server-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  release-client-selfhost:
    needs: [prepare]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: needs.prepare.outputs.push == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_OWNER_REPO }}-client-selfhost
          flavor: latest=false
          tags: type=raw,value=${{ needs.prepare.outputs.version }}
          labels: |
            org.opencontainers.image.title=trackyourtime-client-selfhost
            org.opencontainers.image.description=Track Your Time web app, same-origin build for self-hosting
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.sha }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          # Deliberately NOT packages/client/Dockerfile — that one packages the
          # owner's deploy. This file builds the static export and serves it
          # from a plain static server, which is what the single-domain
          # reverse-proxy layout needs.
          file: packages/client/Dockerfile.selfhost
          # Native runner per arch, as for the server. The runtime stage is
          # static files, but `next build` (SWC, lightningcss, the tailwind
          # oxide binary) runs per leg and is exactly what QEMU was worst at.
          platforms: ${{ matrix.platform }}
          # An EMPTY value, passed explicitly so the intent is visible in the
          # build log rather than looking like an omission. Empty makes every
          # client call site fall back to a relative URL: tRPC to /api/trpc,
          # better-auth to window.location.origin, and the sync socket to
          # wss://<host>/ws. That is what lets one image serve any domain.
          #
          # NEXT_PUBLIC_WS_URL is deliberately absent: it is read nowhere in
          # the source, and offering the knob would send anyone debugging a
          # WebSocket problem down a dead end.
          #
          # COMMIT_SHA stamps /version.json and the bundle, so an open tab can
          # offer a reload after the operator upgrades.
          build-args: |
            NEXT_PUBLIC_API_URL=
            COMMIT_SHA=${{ needs.prepare.outputs.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: ${{ needs.prepare.outputs.push == 'true' && format('type=image,name=ghcr.io/{0}-client-selfhost,push-by-digest=true,name-canonical=true,push=true', env.IMAGE_OWNER_REPO) || 'type=cacheonly' }}
          provenance: ${{ needs.prepare.outputs.push == 'true' && 'mode=max' || 'false' }}
          sbom: ${{ needs.prepare.outputs.push == 'true' }}
          cache-from: type=gha,scope=release-client-selfhost-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-client-selfhost-${{ matrix.arch }}

      - name: Export digest
        if: needs.prepare.outputs.push == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v4
        if: needs.prepare.outputs.push == 'true'
        with:
          name: digests-client-selfhost-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Joins each image's two per-arch digests into one manifest list and tags it
  # with the EXACT version only. `v` is kept, and a prerelease keeps its
  # suffix: v1.2.3-rc.1 is published as v1.2.3-rc.1, which a semver pattern
  # would have rewritten to 1.2.3-rc.1.
  #
  # Each per-arch digest is itself an index holding the image and its
  # provenance/SBOM attestation manifest; `imagetools create` carries those
  # entries into the joined list. They show on the package page as
  # `unknown/unknown` platforms, which docker, containerd and compose skip.
  merge:
    needs: [prepare, release-server, release-client-selfhost]
    if: needs.prepare.outputs.push == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [server, client-selfhost]
    env:
      # Job-level env cannot read the `env` context; keep in step with
      # IMAGE_OWNER_REPO at the top of this file.
      IMAGE: ghcr.io/trebeljahr/trackyourtime-${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true
          path: /tmp/digests

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same key/value set as the build legs' labels, emitted here as INDEX
      # annotations: labels live inside each per-arch image config, and GHCR's
      # package page reads a multi-arch image's description from the index.
      # `annotations:`, not `labels:` — metadata-action builds its annotations
      # output from its own input and would otherwise fall back to the repo's
      # name and description.
      - id: meta
        uses: docker/metadata-action@v5
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: type=raw,value=${{ needs.prepare.outputs.version }}
          annotations: |
            org.opencontainers.image.title=trackyourtime-${{ matrix.image }}
            org.opencontainers.image.description=${{ matrix.image == 'server' && 'Track Your Time API server' || 'Track Your Time web app, same-origin build for self-hosting' }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.sha }}

      - name: Create the manifest list
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r tag; do
            args+=(-t "$tag")
          done < <(jq -r '.tags[]' <<<"$DOCKER_METADATA_OUTPUT_JSON")
          # One array element per annotation: a description contains spaces,
          # and unquoted jq output would split it into several arguments.
          while IFS= read -r annotation; do
            args+=(--annotation "$annotation")
          done < <(jq -r '.annotations[]' <<<"$DOCKER_METADATA_OUTPUT_JSON")

          sources=()
          for digest in *; do
            sources+=("${IMAGE}@sha256:${digest}")
          done
          if [ "${#sources[@]}" -ne 2 ]; then
            echo "::error::expected 2 per-arch digests for ${IMAGE}, found ${#sources[@]}: ${sources[*]:-none}"
            exit 1
          fi

          docker buildx imagetools create "${args[@]}" "${sources[@]}"

      - name: Check both arches and the attestations landed
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          manifest="$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest}}')"
          if ! jq -e '[.manifests[] | .platform // {} | select(.os == "linux") | .architecture] | contains(["amd64", "arm64"])' <<<"$manifest" >/dev/null; then
            echo "::error::${IMAGE}:${VERSION} does not list both linux/amd64 and linux/arm64"
            jq '.manifests[] | {digest, platform}' <<<"$manifest"
            exit 1
          fi
          attestations="$(jq '[.manifests[] | select(.annotations["vnd.docker.reference.type"] == "attestation-manifest")] | length' <<<"$manifest")"
          if [ "$attestations" -lt 2 ]; then
            echo "::error::${IMAGE}:${VERSION} carries ${attestations} attestation manifest(s), expected one per arch — provenance/SBOM did not survive the merge"
            exit 1
          fi
          echo "${IMAGE}:${VERSION}: linux/amd64 + linux/arm64, ${attestations} attestation manifests"

  # Anonymous pull and start, on both arches, of the exact tag `merge` just
  # pushed. No login step anywhere in this job and no `packages` permission:
  # a pull that only works with a token proves nothing about what a
  # self-hoster will see. On the FIRST publish this fails by design —
  # GHCR creates trackyourtime-client-selfhost PRIVATE — and the script's error
  # says how to flip it; then "Re-run failed jobs" re-runs smoke and promote
  # without rebuilding anything.
  smoke:
    needs: [prepare, release-server, release-client-selfhost, merge]
    if: needs.prepare.outputs.push == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      # The compose file, Caddyfile and script from the tagged commit — the
      # ones a self-hoster following that release's docs would use.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      # Fails in seconds, rather than minutes into the script, if a runner
      # image ever ships without the compose plugin.
      - run: docker version && docker compose version

      # Belt and braces: the script also runs docker with a throwaway,
      # credential-free DOCKER_CONFIG.
      - run: docker logout ghcr.io || true

      - name: Pull and start the release anonymously
        env:
          EXPECTED_SHA: ${{ needs.prepare.outputs.sha }}
          # The packages this run pushed, named once at the top of this file.
          IMAGE_REPO: ${{ env.IMAGE_OWNER_REPO }}
          VERIFY_PORT: "80"
          VERSION: ${{ needs.prepare.outputs.version }}
        run: scripts/verify-release-images.sh "$VERSION"

  # Floating tags move last. `imagetools create` re-points X.Y and latest at
  # the exact tag's index digest, so annotations and attestations come along
  # and nothing is rebuilt or re-pushed.
  promote:
    needs: [prepare, smoke]
    if: needs.prepare.outputs.push == 'true' && (needs.prepare.outputs.latest == 'true' || needs.prepare.outputs.minor != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [server, client-selfhost]
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Move the floating tags
        env:
          IMAGE: ghcr.io/${{ env.IMAGE_OWNER_REPO }}-${{ matrix.image }}
          VERSION: ${{ needs.prepare.outputs.version }}
          LATEST: ${{ needs.prepare.outputs.latest }}
          MINOR: ${{ needs.prepare.outputs.minor }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "$MINOR" ]; then args+=(-t "${IMAGE}:${MINOR}"); fi
          if [ "$LATEST" = "true" ]; then args+=(-t "${IMAGE}:latest"); fi
          docker buildx imagetools create "${args[@]}" "${IMAGE}:${VERSION}"
          echo "Moved ${args[*]} onto ${IMAGE}:${VERSION}"
