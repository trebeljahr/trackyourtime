# Dependency autopilot: lands the branches that Claude on the hq box pushes.
# The box scans GitHub's main every morning, a Claude session applies the
# updates on deps/<date> and pushes the branch. This workflow runs the repo's
# checks on it, then fast-forwards main (never a merge, never a force push) and
# starts build-and-deploy, because a push made with GITHUB_TOKEN starts no push
# workflows. When main moved meanwhile it rebases onto main, pushes the result
# as a new deps/ branch and runs itself again on it, so nothing lands untested.
# deps/<date>-major branches only run the checks; they land when Rico says so
# (hq: `deps-state land <repo> <date>`, which dispatches this with land=true).
# No pull requests. The box reads the outcome from this workflow's runs.
name: deps-land
run-name: deps-land ${{ inputs.branch || github.ref_name }}

on:
  push:
    branches: ["deps/**"]
  workflow_dispatch:
    inputs:
      branch:
        description: deps/ branch to check (and land)
        required: true
      land:
        description: land it after the checks
        type: boolean
        default: true

concurrency:
  group: deps-land-${{ inputs.branch || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  target:
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.t.outputs.branch }}
      sha: ${{ steps.t.outputs.sha }}
      land: ${{ steps.t.outputs.land }}
    steps:
      - id: t
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          IN_BRANCH: ${{ inputs.branch }}
          IN_LAND: ${{ inputs.land }}
          REF_NAME: ${{ github.ref_name }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = push ]; then
            branch=$REF_NAME; sha=$PUSH_SHA
            case "$branch" in *-major) land=false ;; *) land=true ;; esac
          else
            branch=$IN_BRANCH; land=$IN_LAND
            sha=$(gh api "repos/$REPO/git/ref/heads/$branch" --jq .object.sha)
          fi
          case "$branch" in deps/*) ;; *) echo "only deps/ branches"; exit 1 ;; esac
          { echo "branch=$branch"; echo "sha=$sha"; echo "land=$land"; } >> "$GITHUB_OUTPUT"
          echo "$branch at $sha, land=$land"

  # Checks: the same gates as build-and-deploy.yml: verify, e2e and desktop. They run
  # the branch's code with a read-only token and no secrets.
  verify:
    needs: [target]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.target.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      # The desktop app is Rust (desktop/, one Cargo workspace): `pnpm run
      # typecheck` cargo-checks it and `pnpm run test:unit` runs its tests.
      # Both compile the Tauri app, which links WebKitGTK and embeds
      # packages/client/out-desktop at compile time, so the toolchain, the
      # system libraries and a throwaway export (against a dead loopback API)
      # come first.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop -> target
      - name: Use Ubuntu's own mirror when Azure's does not resolve
        # GitHub's runners list azure.archive.ubuntu.com first in apt's mirror file, and
        # apt does not move to the next mirror when a name fails to resolve. During an
        # Azure DNS outage (2026-11-11, hours) every package download failed.
        if: runner.os == 'Linux'
        run: |
          if ! getent hosts azure.archive.ubuntu.com >/dev/null && [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
            echo "azure.archive.ubuntu.com does not resolve; apt uses the next mirror"
          fi
      - name: Install the desktop app's build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libdbus-1-dev patchelf
      - name: Build a desktop export for the Rust checks
        run: node scripts/build-desktop.mjs --export-only
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:59999
      # `pnpm run build` compiles shared -> core -> server -> client, which
      # leaves packages/extension, packages/raycast and desktop/ untypechecked
      # — they are not in the build graph at all. A change that breaks the
      # browser extension, the Raycast extension or the desktop app would
      # otherwise go green through the entire pipeline.
      - run: pnpm run typecheck
      # Before the build, so a lint failure costs seconds rather than the full
      # compile. This is the only place eslint is enforced for everyone: the
      # husky pre-push hook runs the same `pnpm run lint`, but a hook lives in
      # a working copy and `--no-verify` skips it, so CI is what keeps the
      # backlog from growing back.
      - run: pnpm run lint
      - run: pnpm run build
      # Approval locks, durable entry replay (`entries.applyOperation`, which
      # every web and desktop entry write takes) and invoice deletion commit in
      # transactions, which a standalone mongod refuses. Their cases skip on
      # one, so the unit suite runs against a single-node replica set.
      - run: bash scripts/mongo-replica-set-container.sh mongo-unit-rs 27020
      - run: pnpm run test:unit
        env:
          # The scheduler's lease, the runaway-reminder job and the cases above
          # are tested against a real database; those files skip without this.
          TEST_MONGODB_URI: mongodb://127.0.0.1:27020
          # Turns those skips into failures: a lost URI or a standalone server
          # must fail the run, not pass it with the riskiest cases unrun.
          REQUIRE_TRANSACTIONS: "1"
      # No standalone-mongod pass any more: since storage quotas (7e8d4a21)
      # every workspace write runs in a transaction and a standalone server
      # refuses it, so the fallback paths that pass exercised are unreachable.
      # docs/storage-limits.md: a replica set or mongos is required.
      - run: pnpm run test:client
      # The client image builds the docs into out/docs/ (packages/client/Dockerfile),
      # but that only runs on a push to main, after merge. Building them here
      # too puts a broken docs link (`onBrokenLinks: "throw"`) or a noindex
      # page in front of the branch instead.
      - run: node scripts/docs/build-into-client.mjs

  e2e:
    needs: [target, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      # Mongo is not a service here: entry writes need a replica set, and a
      # service container cannot take `--replSet`. The step below starts one.
      redis-e2e:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.target.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      # start-server.sh's own Mongo readiness loop is inside an
      # `if [ -z "${CI:-}" ]` guard, so under CI nothing else waits for Mongo;
      # the script returns only once the member is a writable primary.
      - run: bash scripts/mongo-replica-set-container.sh mongo-e2e 27018
      - run: pnpm run build

      - name: Use Ubuntu's own mirror when Azure's does not resolve
        # GitHub's runners list azure.archive.ubuntu.com first in apt's mirror file, and
        # apt does not move to the next mirror when a name fails to resolve. During an
        # Azure DNS outage (2026-11-11, hours) every package download failed.
        if: runner.os == 'Linux'
        run: |
          if ! getent hosts azure.archive.ubuntu.com >/dev/null && [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
            echo "azure.archive.ubuntu.com does not resolve; apt uses the next mirror"
          fi
      - run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npx playwright test
        env:
          CI: "true"
          MONGODB_URI: mongodb://127.0.0.1:27018/starter-e2e
          REDIS_URL: redis://127.0.0.1:6380
          BETTER_AUTH_SECRET: e2e-test-secret
          BETTER_AUTH_URL: http://127.0.0.1:5006
          FRONTEND_URL: http://127.0.0.1:3001

  desktop:
    needs: [target, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.target.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      # A replica set, as in the e2e job: entry writes need transactions.
      - run: bash scripts/mongo-replica-set-container.sh mongo-desktop 27019
      # shared, invoice-pdf and core are what the API and the client import from dist/
      # (core imports @starter/invoice-pdf, so it builds second).
      - run: pnpm --filter @starter/shared run build && pnpm --filter @starter/invoice-pdf run build && pnpm --filter @starter/core run build
      # The Tauri app: Rust, WebKitGTK and the tray's AppIndicator to build
      # it, Xvfb to show its (never-focused) window. The harness builds the
      # export and the debug app with the e2e channel itself
      # (scripts/build-desktop.mjs --e2e).
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop -> target
      - name: Use Ubuntu's own mirror when Azure's does not resolve
        # GitHub's runners list azure.archive.ubuntu.com first in apt's mirror file, and
        # apt does not move to the next mirror when a name fails to resolve. During an
        # Azure DNS outage (2026-11-11, hours) every package download failed.
        if: runner.os == 'Linux'
        run: |
          if ! getent hosts azure.archive.ubuntu.com >/dev/null && [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
            echo "azure.archive.ubuntu.com does not resolve; apt uses the next mirror"
          fi
      - name: Install the desktop app's build and run dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libdbus-1-dev patchelf xvfb dbus-x11
      # Ubuntu 24.04's AppArmor forbids the unprivileged user namespaces
      # WebKitGTK's bubblewrap sandbox puts each web process in. Lifting that
      # on the throwaway runner keeps the sandbox in force under test rather
      # than turning it off.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Run the desktop harness
        run: xvfb-run --auto-servernum -- pnpm run test:e2e:desktop
        env:
          CI: "true"
          MONGODB_URI: mongodb://127.0.0.1:27019/trackyourtime-desktop-e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: desktop-e2e-results
          path: test-results/
          if-no-files-found: ignore

  land:
    needs: [target, verify, e2e, desktop]
    if: needs.target.outputs.land == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Fast-forward main, or rebase and test again
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ needs.target.outputs.branch }}
          SHA: ${{ needs.target.outputs.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q origin main "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
          if [ "$(git rev-parse "origin/$BRANCH")" != "$SHA" ]; then
            echo "$BRANCH moved after the checks; the run for the new tip lands it"; exit 0
          fi
          if git merge-base --is-ancestor origin/main "$SHA"; then
            # Plain push: GitHub refuses it unless it is a fast-forward.
            git push origin "$SHA:refs/heads/main"
            echo "main -> $SHA"
            gh workflow run build-and-deploy.yml --ref main
            git push -q origin --delete "$BRANCH" || true
            exit 0
          fi
          base=${BRANCH%-rebased*}
          n=$(( $(git ls-remote --heads origin "$base-rebased*" | wc -l) + 1 ))
          next="$base-rebased$n"
          git checkout -q -B land "$SHA"
          if ! git rebase -q origin/main; then
            git rebase --abort || true
            echo "::error::$BRANCH does not rebase onto main cleanly"; exit 1
          fi
          git push -q origin "HEAD:refs/heads/$next"
          gh workflow run deps-land.yml --ref main -f branch="$next" -f land=true
          git push -q origin --delete "$BRANCH" || true
          echo "main moved: rebased onto $(git rev-parse --short origin/main) as $next, checks run again"
