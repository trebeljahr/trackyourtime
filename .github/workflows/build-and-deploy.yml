name: build-and-deploy

on:
  push:
    branches: [main]
  # Pull requests reach `dco`, `verify` and `e2e` — the jobs that only read
  # the checkout and run the test suites. They must NEVER reach build-server,
  # build-client or deploy: this file pushes image tags to ghcr.io, moves
  # `:live` and signs Coolify deploy webhooks, and none of that is a thing a
  # PR gets to do.
  #
  # That boundary is enforced per job, not by the `needs:` chain. build-server,
  # build-client and deploy each carry their own
  # `if: github.event_name == 'push'` IN ADDITION to their `needs:`, so the two
  # upstream jobs running on a PR cannot pull them in. Do not remove those
  # three `if:` lines, and do not add a job that depends on verify/e2e without
  # deciding explicitly which events it runs on.
  pull_request:
    types: [opened, synchronize, reopened]

# The group was the constant `main-deploy`, which with cancel-in-progress
# would have let PR runs cancel a main deploy mid-flight (and each other).
# Including the event name and ref keeps every push to main in one group —
# github.ref is always refs/heads/main there — while each PR gets its own
# group, so a new push to a PR branch cancels only that PR's own stale run.
#
# Pushes to main are NOT cancelled in progress any more. Cancelling a run
# cancels its deploy job too, and the deploy job can be between promoting the
# new images to `:live` and putting the old ones back after a failed gate.
# A newer push waits instead; GitHub keeps only the newest waiting run, so a
# burst of pushes still deploys once more, not once per push.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Image names are spelled out, never derived from the repository name. A
# repository rename would otherwise move every push to a new GHCR package —
# which GHCR creates private — while Coolify and self-hosters keep pulling the
# old name. Renaming the repo must not rename the images as a side effect.
env:
  IMAGE_OWNER_REPO: trebeljahr/trackyourtime

permissions:
  contents: read
  packages: write

jobs:
  # Runs on BOTH events: a contributor has to be able to see that their change
  # builds and passes the tests, which is the whole point of opening a PR.
  # Nothing here reads a secret or writes anywhere — see the `permissions:`
  # block below — so it is equally safe from a fork.
  verify:
    runs-on: ubuntu-latest
    services:
      mongo-unit:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    # The workflow-level block grants `packages: write` for the two image
    # pushes. This job pins `contents: read` instead, so PR code never runs
    # with a token that can publish a package. (A fork PR gets a read-only
    # token regardless; this covers same-repo branch PRs too.)
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      # `pnpm run build` compiles shared -> core -> server -> client, which
      # leaves packages/extension, packages/raycast and electron/ untypechecked
      # — they are not in the build graph at all. A change that breaks the
      # browser extension, the Raycast extension or the Electron main process
      # would otherwise go green through the entire pipeline.
      - run: pnpm run typecheck
      # Before the build, so a lint failure costs seconds rather than the full
      # compile. This is the only place eslint is enforced for everyone: the
      # husky pre-push hook runs the same `pnpm run lint`, but a hook lives in
      # a working copy and `--no-verify` skips it, so CI is what keeps the
      # backlog from growing back.
      - run: pnpm run lint
      - run: pnpm run build
      - run: pnpm run test:unit
        env:
          # The scheduler's lease and the runaway-reminder job are tested
          # against a real database; those files skip without this.
          TEST_MONGODB_URI: mongodb://127.0.0.1:27017
      - run: pnpm run test:client
      # The client image builds the docs into out/docs/ (packages/client/Dockerfile),
      # but that only runs on a push to main, after merge. Building them here
      # too puts a broken docs link (`onBrokenLinks: "throw"`) or a noindex
      # page in front of the pull request instead.
      - run: node scripts/docs/build-into-client.mjs

  # Also runs on both events. Every credential it needs is a literal in the
  # `env:` block below (throwaway values for containers that live for the
  # length of the job), so it works unchanged from a fork.
  #
  # It is the slow job — 42 specs, `workers: 1`, plus a client build. If that
  # turns out to be too slow to sit on every push to a draft branch, gate it
  # with `if: github.event_name == 'push' || !github.event.pull_request.draft`
  # and add `ready_for_review` to the pull_request `types:` above, rather than
  # dropping it from PRs entirely.
  e2e:
    runs-on: ubuntu-latest
    needs: [verify]
    permissions:
      contents: read
    services:
      mongo-e2e:
        image: mongo:7
        ports:
          - 27018:27017
        # start-server.sh's own Mongo readiness loop is inside an
        # `if [ -z "${CI:-}" ]` guard, so under CI nothing waits for Mongo —
        # without this the server can start before the database accepts
        # connections, which surfaces as an unexplained failure on somebody's
        # first contribution.
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis-e2e:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      - run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npx playwright test
        env:
          CI: "true"
          MONGODB_URI: mongodb://127.0.0.1:27018/starter-e2e
          REDIS_URL: redis://127.0.0.1:6380
          BETTER_AUTH_SECRET: e2e-test-secret
          BETTER_AUTH_URL: http://127.0.0.1:5006
          FRONTEND_URL: http://127.0.0.1:3001

  # Also runs on both events, and reads no secret. The Electron harness
  # (e2e/desktop/): its global setup builds the desktop export and the bundled
  # main/preload, starts its own production-mode API against the mongo service
  # below, and every spec launches electron/dist/main.js over app://-. Linux
  # has no display, hence xvfb-run. Not in build-server's or build-client's
  # `needs:`, so a desktop-only failure does not hold up a web deploy.
  desktop:
    runs-on: ubuntu-latest
    needs: [verify]
    permissions:
      contents: read
    services:
      mongo-desktop:
        image: mongo:7
        ports:
          - 27019:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      # shared and core are what the API and the client import from dist/.
      - run: pnpm --filter @starter/shared run build && pnpm --filter @starter/core run build
      # Electron 42 has no install script; the binary arrives only when asked.
      - run: pnpm run electron:ensure
      # Chromium's shared libraries for the Electron binary.
      - run: npx playwright install-deps chromium
      # Ubuntu 24.04's AppArmor forbids the unprivileged user namespaces
      # Chromium's sandbox needs, and Electron aborts at launch without them.
      # Lifting that on the throwaway runner keeps `sandbox: true` in force
      # under test instead of launching with --no-sandbox.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Run the desktop harness
        run: xvfb-run --auto-servernum -- pnpm run test:e2e:desktop
        env:
          CI: "true"
          MONGODB_URI: mongodb://127.0.0.1:27019/trackyourtime-desktop-e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: desktop-e2e-results
          path: test-results/
          if-no-files-found: ignore

  # PUSH ONLY. `docker/login-action` below authenticates to ghcr.io with
  # secrets.GITHUB_TOKEN, which is read-only on a fork PR — `push: true` would
  # fail with a 403. The `if:` is what keeps this job off pull requests; the
  # `needs:` does not, since verify and e2e now run on both events.
  build-server:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [verify, e2e]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/server/Dockerfile
          push: true
          build-args: |
            COMMIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER_REPO }}-server:main
            ghcr.io/${{ env.IMAGE_OWNER_REPO }}-server:${{ github.sha }}

  # PUSH ONLY, for the same reason as build-server. Keep the `if:`.
  build-client:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [verify, e2e]
    steps:
      - uses: actions/checkout@v4
      # Error reporting is opt-in per build (an empty NEXT_PUBLIC_SENTRY_DSN
      # leaves the SDK out of the bundle), so an image that reports nothing
      # says so here rather than looking like one that does.
      # docs/deploy.md → Error reporting.
      - name: Error reporting
        env:
          NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
        run: |
          if [ -z "${NEXT_PUBLIC_SENTRY_DSN:-}" ]; then
            echo "::notice::NEXT_PUBLIC_SENTRY_DSN is not set — this build reports no errors. See docs/deploy.md → Error reporting."
          else
            echo "Error reporting is on: NEXT_PUBLIC_SENTRY_DSN is set."
          fi
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/client/Dockerfile
          push: true
          # NEXT_PUBLIC_* are inlined into the browser bundle at image
          # BUILD time — setting them as runtime env on the deployed
          # container does nothing.
          #
          # NEXT_PUBLIC_API_URL is the API's ORIGIN, not a base path: the
          # client appends `/api/trpc` and `/api/auth` itself, and
          # `resolveSyncUrl` appends `/api/ws`. The server still mounts every
          # route at `/api`, so the real tRPC endpoint is
          # `https://api.trackyourtime.dev/api/trpc` — the doubled-looking
          # segment is deliberate, not a stray path in this value.
          #
          # The API is a SEPARATE ORIGIN from the web app, so the browser
          # client is cross-origin: FRONTEND_URL / TRUSTED_ORIGINS on the
          # server are what make sign-in and cookies work, not decoration.
          #
          # Literal rather than only `vars.*`: these were repo VARIABLES with
          # nothing set, so every client image was being built with an empty
          # API URL. A repo variable still wins when set, for a staging or
          # preview host. The analytics values are optional GitHub Actions
          # repo VARIABLES (not secrets):
          #   gh variable set NEXT_PUBLIC_OPENPANEL_CLIENT_ID ...
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'https://api.trackyourtime.dev' }}
            NEXT_PUBLIC_WS_URL=${{ vars.NEXT_PUBLIC_WS_URL || 'wss://api.trackyourtime.dev' }}
            NEXT_PUBLIC_OPENPANEL_CLIENT_ID=${{ vars.NEXT_PUBLIC_OPENPANEL_CLIENT_ID }}
            NEXT_PUBLIC_PLAUSIBLE_DOMAIN=${{ vars.NEXT_PUBLIC_PLAUSIBLE_DOMAIN }}
            NEXT_PUBLIC_PLAUSIBLE_SCRIPT_URL=${{ vars.NEXT_PUBLIC_PLAUSIBLE_SCRIPT_URL }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
            COMMIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER_REPO }}-client:main
            ghcr.io/${{ env.IMAGE_OWNER_REPO }}-client:${{ github.sha }}

  # Deploy job — the topology is TWO Coolify apps on TWO hosts of one zone:
  # the client on trackyourtime.dev and the server on api.trackyourtime.dev.
  # Each app owns its own host, so neither has to share a routing rule with
  # the other.
  #
  # Deploying them separately is the point of the split: the server holds
  # the WebSocket sync connections, and a client-only change must not
  # restart it and drop every connected device's socket.
  #
  # PUSH ONLY, and the `if:` below is the only thing enforcing that. On a
  # fork every COOLIFY_* secret resolves to an empty string and the script
  # prints a ::notice:: that nothing was deployed — that is not a PR safety
  # net, it is how a fork without Coolify behaves.
  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [build-server, build-client]
    # Shared with hosted-rollback.yml, and never cancelled: a deploy stopped
    # between promoting the new images and restoring the old ones leaves the
    # apps' `:live` tag on a build nobody verified. A second deploy waits for
    # the first.
    concurrency:
      group: hosted-deploy
      cancel-in-progress: false
    # A deploy that never lands polls for ten minutes, and its rollback polls
    # for ten more.
    timeout-minutes: 45
    # `packages: write` is what moves `:live` (below), with this job's own
    # GITHUB_TOKEN: it can write this repository's packages and nothing else.
    permissions:
      contents: read
      packages: write
    steps:
      # The full history, because the rollback compares the migration registry
      # of the commit being deployed with the one it replaces (below).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # Promote this commit's images to `:live`, deploy each app through its
      # own signed Coolify webhook, gate, and roll back when the gate fails —
      # scripts/coolify-deploy.mjs, shared with hosted-rollback.yml and tested
      # in scripts/lib/coolify-deploy.test.mjs. hatchkit generalised it into
      # the scripts/hatchkit-deploy.mjs its other projects get, and it looks
      # for that name or a `:live` promote step in this file to know these
      # apps pull `:live`; keep the mention, or `hatchkit sync` points
      # SERVER_IMAGE / CLIENT_IMAGE back at `:main`.
      #
      # There is NO Coolify API token here. Coolify cannot scope one below
      # "every app in the team", and on this one-server install `write` is
      # root on the host, so a token in this repository was a key to every
      # other project on it. Instead:
      #
      # - The image is chosen in GHCR. SERVER_IMAGE and CLIENT_IMAGE in
      #   Coolify name `:live`, and the compose files pull with
      #   `pull_policy: always`, so pointing `:live` at this commit's
      #   immutable `:<sha>` image is the pin. (Docker keeps whatever it has
      #   for a moving tag without that pull policy: on 2026-09-08 Coolify
      #   started the PREVIOUS build while everything reported the new one.)
      # - Each app has its own webhook secret (COOLIFY_<APP>_DEPLOY_SECRET).
      #   A `push` payload signed with it queues a deploy of that one app —
      #   it can read nothing and reach no other app. The payload names
      #   `.hatchkit/deploy-webhook`, the apps' only watch path, so an
      #   ordinary push that reaches Coolify through its GitHub App never
      #   deploys a build that does not exist yet.
      #
      # `hatchkit secrets isolate trackyourtime` sets the secrets, watch paths
      # and `:live`; docs/deploy.md → One-time setup.
      #
      # The rollback target is the commit each app was SERVING before this
      # run (`/api/health`, `/version.json`), provided GHCR still has its
      # `:<sha>` image. Once `:live` moves, nothing else names it.
      #
      # The gate, after both apps report this commit: /api/health says
      # `status: ok` and `db: true`, /version.json names the expected API,
      # GET /api/auth/get-session answers 200, and the CORS preflight from the
      # web origin is allowed. Until the gate existed the final assertion was
      # an HTTP 200 from a POST, and a deploy that kept the old container, an
      # image built with an empty API URL and a container crash-looping behind
      # the proxy all left this workflow green.
      #
      # When the poll or the gate fails, `:live` is pointed back at the
      # previous commits, both apps are redeployed and gated, and the job
      # still FAILS, naming the failed check, this sha and the restored one.
      # No target (a first deploy, an app that was not answering, an image
      # pruned from GHCR) or a rollback that fails its own gate fails loudly
      # and does not try again.
      #
      # Migrations are forward-only. A migration whose minReaderSchema is above
      # the previous build's SCHEMA_VERSION makes that build refuse to start
      # (docs/versioning.md → Migrations), and nobody can tell from outside
      # whether the new server got far enough to run it. So when this commit's
      # registry holds such a migration — or either registry cannot be read —
      # the SERVER is not rolled back: only the client is, and the error says
      # why. Going back past that migration needs the database dump, which is
      # a person's decision (docs/deploy.md → Rollback).
      #
      # With no Coolify secret set the script prints a ::notice:: and deploys
      # nothing; with some set and others missing it fails.
      - name: Deploy, gate and roll back on failure
        env:
          COOLIFY_BASE_URL: ${{ secrets.COOLIFY_BASE_URL }}
          COOLIFY_SERVER_RESOURCE_UUID: ${{ secrets.COOLIFY_SERVER_RESOURCE_UUID }}
          COOLIFY_SERVER_DEPLOY_SECRET: ${{ secrets.COOLIFY_SERVER_DEPLOY_SECRET }}
          COOLIFY_SERVER_DEPLOY_REPOSITORY: ${{ secrets.COOLIFY_SERVER_DEPLOY_REPOSITORY }}
          COOLIFY_SERVER_DEPLOY_BRANCH: ${{ secrets.COOLIFY_SERVER_DEPLOY_BRANCH }}
          COOLIFY_CLIENT_RESOURCE_UUID: ${{ secrets.COOLIFY_CLIENT_RESOURCE_UUID }}
          COOLIFY_CLIENT_DEPLOY_SECRET: ${{ secrets.COOLIFY_CLIENT_DEPLOY_SECRET }}
          COOLIFY_CLIENT_DEPLOY_REPOSITORY: ${{ secrets.COOLIFY_CLIENT_DEPLOY_REPOSITORY }}
          COOLIFY_CLIENT_DEPLOY_BRANCH: ${{ secrets.COOLIFY_CLIENT_DEPLOY_BRANCH }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WEB_URL: ${{ vars.NEXT_PUBLIC_APP_URL || 'https://trackyourtime.dev' }}
          API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'https://api.trackyourtime.dev' }}
          SHA: ${{ github.sha }}
        run: node scripts/coolify-deploy.mjs deploy --sha "$SHA" --which both --rollback

  # DCO gate — pull requests only. Track Your Time takes Developer Certificate of
  # Origin 1.1 sign-off rather than a CLA, so the check is mechanical: every
  # non-merge commit in the PR carries a `Signed-off-by:` trailer.
  # Hand-rolled bash on purpose — no third-party action in the trust path of a
  # job that runs against untrusted PR code.
  #
  # The workflow-level block grants `packages: write` for the image pushes, so
  # this job pins its own `contents: read` rather than inheriting that scope —
  # as verify and e2e now do too. No job a pull request can reach writes
  # anything. The pull_request event (rather than pull_request_target) also
  # gives a read-only token for fork PRs.
  dco:
    name: Signed-off-by present on every commit
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is required — the default shallow checkout cannot walk
      # base..head. The default pull_request ref is the merge commit, whose
      # two parents ARE base.sha and head.sha, so both ends of the range are
      # already present without a second fetch, forks included.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify DCO sign-off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          for sha in "$BASE_SHA" "$HEAD_SHA"; do
            if ! git cat-file -e "${sha}^{commit}" 2>/dev/null; then
              echo "Fetching missing commit $sha"
              git fetch --no-tags --quiet origin "$sha" || true
            fi
          done

          # --no-merges so a branch that has main merged into it is judged on
          # its own commits; nobody signs off a merge they did not author.
          commits="$(git rev-list --no-merges "$BASE_SHA".."$HEAD_SHA")"

          if [ -z "$commits" ]; then
            echo "No non-merge commits between $BASE_SHA and $HEAD_SHA - nothing to check."
            exit 0
          fi

          total=0
          missing=0
          while IFS= read -r sha; do
            [ -n "$sha" ] || continue
            total=$((total + 1))
            subject="$(git show -s --format='%s' "$sha")"
            author="$(git show -s --format='%an <%ae>' "$sha")"
            # %(trailers:...) is git's own trailer parser: it reads only the
            # trailer block at the end of the message, so the words
            # "Signed-off-by" appearing in prose in the body do not count.
            trailers="$(git show -s --format='%(trailers:key=Signed-off-by,valueonly)' "$sha")"

            if [ -z "$(printf '%s' "$trailers" | tr -d '[:space:]')" ]; then
              echo "MISSING  ${sha:0:12}  ${subject}"
              echo "         author: ${author}"
              missing=$((missing + 1))
            elif printf '%s\n' "$trailers" | grep -qxF "$author"; then
              echo "ok       ${sha:0:12}  ${subject}"
            else
              # Not fatal: a sign-off under a second identity (a work address,
              # GitHub's noreply form) is still a sign-off. Surfaced only so a
              # genuine typo is visible in the log.
              echo "ok       ${sha:0:12}  ${subject}"
              echo "         note: signed off as $(printf '%s' "$trailers" | paste -sd ';' -), author is ${author}"
            fi
          done <<< "$commits"

          if [ "$missing" -gt 0 ]; then
            echo ""
            echo "--------------------------------------------------------------"
            echo "DCO check failed: $missing of $total commit(s) have no Signed-off-by trailer."
            echo ""
            echo "Contributions to Track Your Time are accepted under the Developer"
            echo "Certificate of Origin 1.1 (see CONTRIBUTING.md). Every commit"
            echo "must carry a Signed-off-by trailer certifying that you have the"
            echo "right to submit it under the project's license."
            echo ""
            echo "Sign new commits as you make them:"
            echo ""
            echo "    git commit -s -m \"your message\""
            echo ""
            echo "Add the trailer to the commits already on this branch, then"
            echo "update the pull request branch:"
            echo ""
            echo "    git rebase --signoff origin/main"
            echo "    git push --force-with-lease"
            echo ""
            echo "To sign off automatically from now on:"
            echo ""
            echo "    git config --global format.signOff true"
            echo "--------------------------------------------------------------"
            exit 1
          fi

          echo "All $total commit(s) signed off."
