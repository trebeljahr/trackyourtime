name: hosted-rollback

# Put the hosted apps on an earlier commit, by hand, with the same deploys and
# gates as build-and-deploy.yml:
#
# - the server (api.trackyourtime.dev): `:live` is pointed at the commit's
#   image with this run's GITHUB_TOKEN and the Coolify app is queued through
#   its own signed webhook. No Coolify API token.
# - the web app (trackyourtime.dev): the Cloudflare Worker version uploaded
#   for the commit gets all traffic again (scripts/worker-deploy.mjs). A
#   version keeps its own files, so this is complete and takes seconds.
#
# docs/deploy.md → Rollback says when to use it.
#
#   gh workflow run hosted-rollback.yml -f sha=<commit> -f which=both
#
# Only commits that build-and-deploy.yml built on main have a server image
# (ghcr.io/trebeljahr/trackyourtime-server:<sha>) and a Worker version tagged
# with the sha, so the commit must be on main — and, for the web app, built
# after the move to the Worker (2026-10-18). When the gate fails, the run
# fails and the app stays on `sha`: the build served before this run is
# usually the one being escaped, and putting it back would redeploy it.
# `restore_on_failure` puts it back instead, exactly as after a failed push
# deploy — for a rollback that is a trial rather than an escape.
#
# Both workflows share one concurrency group, and GitHub keeps one waiting run
# per group: a rollback queued behind a running push deploy is cancelled by a
# later push. docs/deploy.md → "Rolling back by hand" says how to watch for
# that and re-dispatch.
#
# The server is refused when the database it would start on carries a
# migration it cannot read (a minReaderSchema above its SCHEMA_VERSION —
# docs/versioning.md → Migrations): it would not start. `which: client` rolls
# back the web app alone; `force_server` is for after the database was
# restored from a dump taken before that migration.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Commit on main to deploy (full or abbreviated sha)
        required: true
        type: string
      which:
        description: Which app to move
        required: true
        type: choice
        default: both
        options: [both, client, server]
      force_server:
        description: Deploy the server even past a migration it cannot read (only after restoring a dump)
        required: false
        type: boolean
        default: false
      restore_on_failure:
        description: When the gate fails, point :live back at the commits served before this run (off, since those are usually the build being escaped)
        required: false
        type: boolean
        default: false

# `packages: write` moves the server's `:live` in this repository's own GHCR
# packages and nothing else.
permissions:
  contents: read
  packages: write

jobs:
  rollback:
    runs-on: ubuntu-latest
    # The same group as build-and-deploy.yml's deploy job, so a push deploy
    # and a rollback never move `:live` at the same time.
    concurrency:
      group: hosted-deploy
      cancel-in-progress: false
    timeout-minutes: 45
    steps:
      # Full history: the sha is resolved and checked against main here, and
      # the migration registries of two commits are compared.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Resolve the commit
        id: resolve
        env:
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$INPUT_SHA" | grep -Eq '^[0-9a-fA-F]{7,40}$'; then
            echo "::error::'$INPUT_SHA' is not a commit sha."
            exit 1
          fi
          if ! sha=$(git rev-parse --verify --quiet "${INPUT_SHA}^{commit}"); then
            echo "::error::$INPUT_SHA is not a commit in this repository."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::$sha is not on main, so build-and-deploy.yml never built images for it."
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Deploying $sha: $(git log -1 --format='%s (%cs)' "$sha")"

      # Each script prints a ::notice:: and does nothing when its secrets are
      # not set, and fails when only some are. Server first, as on a push.
      - name: Deploy the server, gate and roll back on failure
        if: inputs.which != 'client'
        env:
          COOLIFY_BASE_URL: ${{ secrets.COOLIFY_BASE_URL }}
          COOLIFY_SERVER_RESOURCE_UUID: ${{ secrets.COOLIFY_SERVER_RESOURCE_UUID }}
          COOLIFY_SERVER_DEPLOY_SECRET: ${{ secrets.COOLIFY_SERVER_DEPLOY_SECRET }}
          COOLIFY_SERVER_DEPLOY_REPOSITORY: ${{ secrets.COOLIFY_SERVER_DEPLOY_REPOSITORY }}
          COOLIFY_SERVER_DEPLOY_BRANCH: ${{ secrets.COOLIFY_SERVER_DEPLOY_BRANCH }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_OWNER_REPO: trebeljahr/trackyourtime
          WEB_URL: ${{ vars.NEXT_PUBLIC_APP_URL || 'https://trackyourtime.dev' }}
          API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'https://api.trackyourtime.dev' }}
          SHA: ${{ steps.resolve.outputs.sha }}
          FORCE_SERVER: ${{ inputs.force_server }}
          RESTORE_ON_FAILURE: ${{ inputs.restore_on_failure }}
        run: |
          set -euo pipefail
          args=(deploy --sha "$SHA" --which server --guard-server-downgrade)
          if [ "$FORCE_SERVER" = "true" ]; then args+=(--force-server); fi
          if [ "$RESTORE_ON_FAILURE" = "true" ]; then args+=(--rollback); fi
          node scripts/coolify-deploy.mjs "${args[@]}"

      - name: Activate the web app, gate and roll back on failure
        if: inputs.which != 'server'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WEB_URL: ${{ vars.NEXT_PUBLIC_APP_URL || 'https://trackyourtime.dev' }}
          API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'https://api.trackyourtime.dev' }}
          SHA: ${{ steps.resolve.outputs.sha }}
          RESTORE_ON_FAILURE: ${{ inputs.restore_on_failure }}
        run: |
          set -euo pipefail
          args=(activate --sha "$SHA")
          if [ "$RESTORE_ON_FAILURE" = "true" ]; then args+=(--rollback); fi
          node scripts/worker-deploy.mjs "${args[@]}"
