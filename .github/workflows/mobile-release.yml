name: Mobile Release

# Builds, signs and uploads the phone apps: an Android AAB to Google Play and an
# iOS IPA to TestFlight. Runs beside release.yml on every `v*` tag, and on
# manual dispatch.
#
# What each job does is decided up front by scripts/mobile-release-plan.mjs
# (rules and tests: scripts/lib/mobile-release.mjs), before anything is built:
#
#   complete secret set     build, sign, upload the artifact, upload to the store
#   no secrets, on a tag    nothing built, NO artifact, green with a ::notice::
#   no secrets, dispatched  Android: an unsigned AAB named -unsigned.
#                           iOS: a compile check with signing off, no artifact.
#   partial secret set      ::error:: on every event
#
# The tag case is why this workflow was once dispatch-only: on v0.1.0, with no
# secrets on the repo, the Android job went green and attached an unsigned .aab
# to the tag's run — downloadable from a public repo for 90 days and looking
# like a release — and the iOS job went red at Archive. Both are now a notice.
#
# Android sets:  ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
#                ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD (signing), then
#                PLAY_SERVICE_ACCOUNT_JSON + ANDROID_PACKAGE_NAME (Play upload,
#                which needs signing). docs/deploy.md -> "Android release signing".
# iOS set:       APPLE_CERTIFICATE_BASE64, APPLE_CERTIFICATE_PASSWORD,
#                APPLE_PROVISIONING_PROFILE_BASE64, APPLE_PROVISIONING_PROFILE_NAME,
#                APPLE_API_KEY_BASE64, APPLE_API_KEY_ID, APPLE_API_ISSUER_ID —
#                and then DEVELOPMENT_TEAM in ios/App/App.xcodeproj and a
#                committed ios/App/ExportOptions.plist.template are required.
#                docs/deploy.md -> "iOS release".
#
# iOS SIGNS MANUALLY IN CI, and that is the one thing in here not to "simplify".
# The v0.1.0 tag failed the Archive step with:
#
#   error: Communication with Apple failed: Your team has no devices from which
#          to generate a provisioning profile.
#   error: No profiles for 'com.ricoslabs.trackyourtime' were found: Xcode
#          couldn't find any iOS App Development provisioning profiles ...
#
# with a valid Apple DISTRIBUTION certificate imported and an App Manager API
# key. It is asking for a DEVELOPMENT profile, and for devices, on a build whose
# only destination is the App Store. That is not a missing credential; it is
# what `xcodebuild archive` does with CODE_SIGN_STYLE = Automatic. Measured
# locally against this project, with the same distribution-only identity the
# runner has and no ASC calls at all:
#
#   as committed (CODE_SIGN_IDENTITY = "iPhone Developer")  -> wants iOS App Development
#   + a shared App.xcscheme with ArchiveAction = Release    -> wants iOS App Development
#   CODE_SIGN_IDENTITY deleted (resolves Apple Development) -> wants iOS App Development
#   CODE_SIGN_IDENTITY = "Apple Distribution", still automatic
#                                        -> "conflicting provisioning settings"
#   CODE_SIGN_STYLE=Manual + PROVISIONING_PROFILE_SPECIFIER
#     + CODE_SIGN_IDENTITY="Apple Distribution"
#                                        -> wants exactly the named profile
#
# So neither the scheme nor the configuration was ever the problem (the Archive
# step has always passed `-configuration Release`), and no value of
# CODE_SIGN_IDENTITY makes automatic signing archive for distribution.
# Xcode.app gets away with automatic signing because the Organizer RE-SIGNS for
# distribution when you press "Distribute App"; `xcodebuild archive` has no
# such second pass, so it signs for development and stops.
#
# -allowProvisioningUpdates does not rescue it — it is what produced the first
# error above, by asking Apple to CREATE the development profile. A device
# would satisfy Apple, which is why registering one "fixes" this on the web;
# an App Store build must not need one, so this signs manually instead.
#
# The Xcode PROJECT and `pnpm dev:ios` stay on CODE_SIGN_STYLE = Automatic:
# only the two steps below override it, on the command line. Nothing in CI asks
# App Store Connect to mint a profile any more, so the API key is used for the
# TestFlight upload alone.
#
# Same shape as the desktop `mas` channel's MAS_PROVISIONING_PROFILE_BASE64, and
# as the other iOS app on this Apple team (which archives green this way).
#
# Tracks. A stable tag uploads to the Play track in the MOBILE_PLAY_TRACK repo
# variable (default internal), rolled out to MOBILE_PLAY_USER_FRACTION of users
# when that is set (a staged rollout, status inProgress). A prerelease tag
# (`v1.2.0-rc.1`) always goes to internal, whatever the variables say. iOS goes
# to TestFlight from a stable tag or a dispatch only: a prerelease tag is
# skipped with a notice, because the tag pins package.json and MARKETING_VERSION
# to `1.2.0-rc.1` and App Store Connect refuses a marketing version that is not
# dotted integers. App Store submission, and its phased release, are App Store
# Connect steps.
#
# Versions. The plan refuses a tag that is not package.json's version, and
# build-mobile.mjs refuses a MARKETING_VERSION / versionName that is not
# package.json's. The build numbers (versionCode, CURRENT_PROJECT_VERSION) are
# the plan's `build_number`, run number × 100 + attempt: both stores refuse a
# number they have seen, and `github.run_number` alone does not grow on
# "Re-run all jobs", so a re-run after a successful upload would fail there.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      play-track:
        description: "Google Play track for the signed AAB. A prerelease tag is refused anything but internal"
        required: true
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
        default: internal
      user-fraction:
        description: "Staged rollout: share of users, e.g. 0.1 for 10 %. Empty is a full rollout. Not on internal"
        required: false
        type: string
        default: ""

# One upload per ref at a time, never cancelled half-way: a cancelled Play edit
# or TestFlight upload can leave state the next run trips on.
concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# The API origin baked into the static export. See the long note in
# desktop-release.yml: a repo VARIABLE with a literal fallback, because this was
# read as `secrets.NEXT_PUBLIC_API_URL`, that secret is not set, and an unset
# secret expands to the empty string rather than failing — which for a
# build-time-inlined NEXT_PUBLIC_* means shipping an app permanently pointed at
# nothing. Same read as the main pipeline settled on in 33f4683.
#
# scripts/build-mobile.mjs owns the assertion here: it refuses to run with this
# unset, rejects a value carrying a path, and afterwards greps the emitted
# chunks for the literal. So an empty or misspelled value fails the job rather
# than producing an .aab, and the workflow needs no separate check.
env:
  NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'https://api.trackyourtime.dev' }}
  # Error reporting, baked in the same way: a repo VARIABLE, empty by default.
  # Empty means the reporting SDK is not in the bundle at all
  # (packages/client/src/lib/error-reporting/reporter.ts); each job's "Error
  # reporting" step says which it was. docs/deploy.md → Error reporting.
  NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}

jobs:
  android:
    runs-on: ubuntu-latest
    # Job-level, not step-level: a step's own `env:` is not in scope for that
    # step's `if:`. KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD are the names
    # android/app/build.gradle's signing block reads.
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      # Presence only; the script never prints a value. The track and rollout
      # are the dispatch inputs on a dispatch and the repo variables on a tag —
      # written so an empty user-fraction input stays empty rather than falling
      # through to the variable.
      - name: Plan
        id: plan
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          ANDROID_PACKAGE_NAME: ${{ secrets.ANDROID_PACKAGE_NAME }}
          PLAY_TRACK: ${{ github.event_name == 'workflow_dispatch' && inputs.play-track || vars.MOBILE_PLAY_TRACK }}
          PLAY_USER_FRACTION: ${{ github.event_name == 'workflow_dispatch' && inputs.user-fraction || (github.event_name != 'workflow_dispatch' && vars.MOBILE_PLAY_USER_FRACTION || '') }}
        run: node scripts/mobile-release-plan.mjs android

      # No `version:` input — see desktop-release.yml. action-setup reads
      # `packageManager` from package.json and throws on a differing pin.
      - uses: pnpm/action-setup@v4
        if: steps.plan.outputs.build != 'skip'

      - uses: actions/setup-node@v4
        if: steps.plan.outputs.build != 'skip'
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-java@v4
        if: steps.plan.outputs.build != 'skip'
        with:
          distribution: temurin
          java-version: 21

      - name: Install deps
        if: steps.plan.outputs.build != 'skip'
        run: pnpm install --frozen-lockfile

      # Opt-in per build, so a release that reports nothing must say so in
      # its log rather than look like one that does.
      - name: Error reporting
        run: |
          if [ -z "${NEXT_PUBLIC_SENTRY_DSN:-}" ]; then
            echo "::notice::NEXT_PUBLIC_SENTRY_DSN is not set — this build reports no errors. See docs/deploy.md → Error reporting."
          else
            echo "Error reporting is on: NEXT_PUBLIC_SENTRY_DSN is set."
          fi

      # Also asserts versionName and the identifiers against package.json and
      # capacitor.config.ts.
      - name: Build static export
        if: steps.plan.outputs.build != 'skip'
        run: pnpm build:mobile android

      - name: Decode signing keystore
        if: steps.plan.outputs.build == 'signed'
        run: |
          mkdir -p android/app
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore

      # `signingConfigs.release` in android/app/build.gradle is conditional on
      # android/app/release.keystore existing AND the three passwords/alias being
      # set, so the unsigned dispatch build and a local `./gradlew bundleRelease`
      # with no keystore both still build.
      - name: Build AAB
        if: steps.plan.outputs.build != 'skip'
        working-directory: android
        env:
          ANDROID_VERSION_CODE: ${{ steps.plan.outputs.build_number }}
        run: ./gradlew bundleRelease

      # Gradle signs with whatever config it was handed and says nothing when
      # that config is empty, so "the secrets are set" and "the bundle is
      # signed" are two different facts. Assert the second one here, or the
      # Play upload is where we find out.
      - name: Verify the AAB is signed
        if: steps.plan.outputs.build == 'signed'
        run: |
          set -euo pipefail
          AAB=$(find android/app/build/outputs/bundle/release -name "*.aab" | head -n1)
          if ! jarsigner -verify "$AAB" | grep -q 'jar verified'; then
            echo "::error::$AAB is not signed — a keystore was decoded but gradle did not use it" >&2
            jarsigner -verify "$AAB" >&2 || true
            exit 1
          fi
          echo "✓ $AAB is signed"

      # The unsigned dispatch build says what it is in the artifact name.
      - name: Upload AAB
        if: steps.plan.outputs.build == 'signed' || steps.plan.outputs.build == 'unsigned'
        uses: actions/upload-artifact@v4
        with:
          name: android-aab-${{ steps.plan.outputs.version }}${{ steps.plan.outputs.build == 'unsigned' && '-unsigned' || '' }}
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      # status inProgress + userFraction is a staged rollout; Play then waits for
      # the rollout to be raised or halted in the Play Console. The first upload
      # of a never-published app must be done by hand (docs/deploy.md).
      - name: Upload to Google Play (${{ steps.plan.outputs.track }})
        if: steps.plan.outputs.upload == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ secrets.ANDROID_PACKAGE_NAME }}
          releaseFiles: android/app/build/outputs/bundle/release/*.aab
          track: ${{ steps.plan.outputs.track }}
          status: ${{ steps.plan.outputs.status }}
          userFraction: ${{ steps.plan.outputs.user_fraction }}

  ios:
    runs-on: macos-latest
    # Job-level for the same reason as Android: the `if:` guards below read the
    # plan, and every step that uses a secret reads it from here.
    env:
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
      APPLE_PROVISIONING_PROFILE_NAME: ${{ secrets.APPLE_PROVISIONING_PROFILE_NAME }}
      APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Plan
        id: plan
        run: node scripts/mobile-release-plan.mjs ios

      # No `version:` input — see desktop-release.yml. action-setup reads
      # `packageManager` from package.json and throws on a differing pin.
      - uses: pnpm/action-setup@v4
        if: steps.plan.outputs.build != 'skip'

      - uses: actions/setup-node@v4
        if: steps.plan.outputs.build != 'skip'
        with:
          node-version: 24
          cache: pnpm

      - name: Install deps
        if: steps.plan.outputs.build != 'skip'
        run: pnpm install --frozen-lockfile

      - name: Error reporting
        run: |
          if [ -z "${NEXT_PUBLIC_SENTRY_DSN:-}" ]; then
            echo "::notice::NEXT_PUBLIC_SENTRY_DSN is not set — this build reports no errors. See docs/deploy.md → Error reporting."
          else
            echo "Error reporting is on: NEXT_PUBLIC_SENTRY_DSN is set."
          fi

      # Also asserts MARKETING_VERSION and the identifiers against package.json
      # and capacitor.config.ts.
      - name: Build static export + sync
        if: steps.plan.outputs.build != 'skip'
        run: pnpm build:mobile ios

      # No `pod install`: Capacitor 8 generates an SPM project (there is no
      # Podfile and no App.xcworkspace), and CocoaPods is not installed on the
      # machines this is developed on either. Dependencies come from
      # ios/App/CapApp-SPM, resolved by xcodebuild.

      - name: Compile without signing
        if: steps.plan.outputs.build == 'check'
        working-directory: ios/App
        run: |
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Import signing certificate, API key and provisioning profile
        if: steps.plan.outputs.build == 'signed'
        env:
          KEYCHAIN_PASSWORD: ci-temp-password
        run: |
          set -euo pipefail
          echo "$APPLE_CERTIFICATE_BASE64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import "$RUNNER_TEMP/cert.p12" -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm "$RUNNER_TEMP/cert.p12"
          # altool looks for the key here, by id. Nothing else reads it: with
          # manual signing the archive and the export make no App Store Connect
          # calls.
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$APPLE_API_KEY_BASE64" | base64 -d \
            > "$HOME/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          # Xcode reads installed profiles from here by their embedded team and
          # name, which is why the NAME is a secret beside the bytes: a profile
          # on disk that nothing names is never used.
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          echo "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 -d \
            > "$PROFILE_DIR/trackyourtime-distribution.mobileprovision"

      # Fail here, with a readable message, rather than twenty minutes later in
      # Archive: a profile that does not decode, is not for this bundle id, has
      # expired, or whose Name is not the one the secret claims, is a wrong
      # secret and not a build problem. `security cms -D` prints the profile's
      # plist; the app id is "<team>.<bundle id>".
      - name: Check the provisioning profile
        if: steps.plan.outputs.build == 'signed'
        run: |
          set -euo pipefail
          PROFILE="$HOME/Library/MobileDevice/Provisioning Profiles/trackyourtime-distribution.mobileprovision"
          PLIST="$RUNNER_TEMP/profile.plist"
          security cms -D -i "$PROFILE" > "$PLIST"
          NAME=$(plutil -extract Name raw -o - "$PLIST")
          APPID=$(plutil -extract Entitlements.application-identifier raw -o - "$PLIST")
          # `raw` prints a date as ISO 8601 UTC, which `date -j -f` reads back.
          # PlistBuddy would print it in the runner's locale instead.
          EXPIRES=$(plutil -extract ExpirationDate raw -o - "$PLIST")
          DEVICES=$(plutil -extract ProvisionedDevices raw -o - "$PLIST" 2>/dev/null || true)
          echo "profile: $NAME"
          echo "app id:  $APPID"
          echo "expires: $EXPIRES"
          if [ "$NAME" != "$APPLE_PROVISIONING_PROFILE_NAME" ]; then
            echo "::error::APPLE_PROVISIONING_PROFILE_NAME is '$APPLE_PROVISIONING_PROFILE_NAME' but the installed profile is named '$NAME'. xcodebuild matches on the name, so these must agree." >&2
            exit 1
          fi
          if [ "$APPID" != "4BHY8H2J25.com.ricoslabs.trackyourtime" ]; then
            echo "::error::The profile is for '$APPID', not 4BHY8H2J25.com.ricoslabs.trackyourtime." >&2
            exit 1
          fi
          # A profile listing devices is a Development or Ad Hoc one. It can sign
          # a build, and App Store Connect then rejects the upload — so refuse it
          # here, where the reason is still visible.
          if [ -n "$DEVICES" ]; then
            echo "::error::The profile lists provisioned devices, so it is a Development or Ad Hoc profile. An App Store profile has none. Create an 'App Store' distribution profile for com.ricoslabs.trackyourtime — docs/deploy.md → iOS release." >&2
            exit 1
          fi
          # A profile lasts a year. Expired, codesign fails with "Provisioning
          # profile ... has expired" deep in the archive log; say it here.
          if [ "$(date -j -f "%Y-%m-%dT%H:%M:%SZ" "$EXPIRES" +%s)" -le "$(date +%s)" ]; then
            echo "::error::The provisioning profile expired on $EXPIRES. Renew it and reset both APPLE_PROVISIONING_PROFILE_* secrets — docs/deploy.md → iOS release." >&2
            exit 1
          fi

      # Manual signing names the profile in the plist, so it is rendered from the
      # secret rather than committed. The template is the reviewable half.
      #
      # PlistBuddy, not sed: a profile name is a string somebody typed in the
      # Developer portal, and `&` in a sed replacement means "the text that
      # matched". "Track & Time App Store" would render as something else and
      # fail at the export, where the message names a profile nobody wrote.
      - name: Render ExportOptions.plist
        if: steps.plan.outputs.build == 'signed'
        run: |
          set -euo pipefail
          RENDERED="$RUNNER_TEMP/ExportOptions.plist"
          cp ios/App/ExportOptions.plist.template "$RENDERED"
          /usr/libexec/PlistBuddy -c \
            "Set :provisioningProfiles:com.ricoslabs.trackyourtime ${APPLE_PROVISIONING_PROFILE_NAME}" \
            "$RENDERED"
          plutil -lint "$RENDERED"
          # Single-quoted so the backslashes reach plutil. plutil splits a key
          # path on ".", and the bundle id contains two — unquoted, the shell
          # strips the escapes and plutil looks for com → ricoslabs →
          # trackyourtime, three nested keys that do not exist. PlistBuddy had
          # written the value correctly; only this read was wrong, and it failed
          # the whole iOS leg.
          RENDERED_NAME=$(plutil -extract 'provisioningProfiles.com\.ricoslabs\.trackyourtime' raw -o - "$RENDERED")
          if [ "$RENDERED_NAME" != "$APPLE_PROVISIONING_PROFILE_NAME" ]; then
            echo "::error::ExportOptions.plist names '$RENDERED_NAME', not the profile the archive was signed with." >&2
            exit 1
          fi

      # Manual signing, overridden here only — see the header. The three
      # overrides are one decision and must move together: Automatic style plus
      # an explicit Apple Distribution identity is refused as "conflicting
      # provisioning settings", and Manual style without a profile specifier has
      # nothing to sign against. DEVELOPMENT_TEAM is passed explicitly so the
      # profile lookup is by team AND name, as Xcode matches it.
      #
      # No -allowProvisioningUpdates and no API key: manual signing asks Apple
      # for nothing. Adding the flag back is what asked Apple to create a
      # development profile and failed the v0.1.0 tag.
      - name: Archive
        if: steps.plan.outputs.build == 'signed'
        working-directory: ios/App
        run: |
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$PWD/build/App.xcarchive" \
            -destination 'generic/platform=iOS' \
            DEVELOPMENT_TEAM=4BHY8H2J25 \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="$APPLE_PROVISIONING_PROFILE_NAME" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            CURRENT_PROJECT_VERSION=${{ steps.plan.outputs.build_number }} \
            archive

      # The rendered plist signs manually too, with the same profile, so the
      # export re-signs against what the archive was already signed with and
      # makes no App Store Connect calls either.
      - name: Export IPA
        if: steps.plan.outputs.build == 'signed'
        working-directory: ios/App
        run: |
          xcodebuild -exportArchive \
            -archivePath "$PWD/build/App.xcarchive" \
            -exportPath "$PWD/build/ipa" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload IPA
        if: steps.plan.outputs.build == 'signed'
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-${{ steps.plan.outputs.version }}
          path: ios/App/build/ipa/*.ipa
          if-no-files-found: error

      - name: Upload to TestFlight
        if: steps.plan.outputs.upload == 'true'
        run: |
          set -euo pipefail
          IPA=$(find ios/App/build/ipa -name "*.ipa" | head -n1)
          xcrun altool --upload-app \
            --file "$IPA" \
            --type ios \
            --apiKey "$APPLE_API_KEY_ID" \
            --apiIssuer "$APPLE_API_ISSUER_ID"

      - name: Remove the signing keychain
        if: always() && steps.plan.outputs.build == 'signed'
        run: security delete-keychain build.keychain || true
