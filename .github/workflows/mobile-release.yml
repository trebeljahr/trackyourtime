name: Mobile Release

# Manual dispatch only (Actions -> Mobile Release -> Run workflow); a `v*` tag
# does not start it — see the note under `on:`. Builds an Android AAB and an iOS
# archive. Signing and store uploads are gated on secrets — without them the
# Android job produces an UNSIGNED bundle as an Actions artifact, and the iOS
# job cannot archive at all (no development team is configured).

on:
  # No `push: tags` trigger, on purpose. v0.1.0 ships the two self-host images
  # (release.yml) and nothing else: no store build is claimed as released, and
  # none of the signing or store secrets exist on this repo. Left on the tag,
  # the iOS job would go red at Archive, and the Android job would go green and
  # upload an unsigned .aab as an artifact of the tag's run — downloadable from this public
  # repo for 90 days, looking like a release artifact.
  #
  # Before adding `push: { tags: ["v*"] }` back above workflow_dispatch:
  #   - Android: the ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
  #     ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD secrets (docs/deploy.md ->
  #     "Android release signing"), plus PLAY_SERVICE_ACCOUNT_JSON and
  #     ANDROID_PACKAGE_NAME for the Play upload
  #   - iOS: DEVELOPMENT_TEAM set in ios/App/App.xcodeproj, a committed
  #     ios/App/ExportOptions.plist, and the APPLE_CERTIFICATE_BASE64,
  #     APPLE_CERTIFICATE_PASSWORD, APPLE_API_KEY_BASE64, APPLE_API_KEY_ID and
  #     APPLE_API_ISSUER_ID secrets — moved into the iOS job's job-level
  #     `env:`, because its `if:` guards read them and a step's own `env:` is
  #     not in scope for that step's `if:` (Export IPA has no env at all)
  #   - run a dispatch of this workflow green on both jobs first
  workflow_dispatch:

# The API origin baked into the static export. See the long note in
# desktop-release.yml: a repo VARIABLE with a literal fallback, because this was
# read as `secrets.NEXT_PUBLIC_API_URL`, that secret is not set, and an unset
# secret expands to the empty string rather than failing — which for a
# build-time-inlined NEXT_PUBLIC_* means shipping an app permanently pointed at
# nothing. Same read as the main pipeline settled on in 33f4683.
#
# scripts/build-mobile.mjs owns the assertion here: it refuses to run with this
# unset, rejects a value carrying a path, and afterwards greps the emitted
# chunks for the literal. So an empty or misspelled value fails the job rather
# than producing an .aab, and the workflow needs no separate check.
env:
  NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'https://api.trackyourtime.dev' }}

jobs:
  android:
    runs-on: ubuntu-latest
    # Job-level rather than step-level, so the `if:` guards below can read them.
    # The four names on the right are the GitHub secrets to set; the four on the
    # left are exactly what android/app/build.gradle's signing block reads.
    # docs/deploy.md -> "Android release signing" has the commands.
    #
    # PLAY_SERVICE_ACCOUNT_JSON is here for the same reason: the Play upload's
    # `if:` reads it, and declared only on that step it was never visible to
    # the guard, so the upload skipped even with the secret set.
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4

      # No `version:` input — see desktop-release.yml. action-setup reads
      # `packageManager` from package.json and throws on a differing pin.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build static export
        run: pnpm build:mobile android

      # A keystore alone signs nothing: the other three secrets carry the
      # passwords and the alias. Half a signing setup would otherwise fall
      # through the gradle guard and produce an unsigned bundle with a green
      # build — the exact trap this job used to be stuck in.
      - name: Check the signing secrets are complete
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          missing=""
          [ -n "$KEYSTORE_PASSWORD" ] || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ] || missing="$missing ANDROID_KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ] || missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is set but these secrets are not:$missing"
            exit 1
          fi

      - name: Decode signing keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          mkdir -p android/app
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore

      # Signed when all four inputs are present, unsigned otherwise.
      # `signingConfigs.release` in android/app/build.gradle is conditional on
      # android/app/release.keystore existing AND these three names being set,
      # so a half-configured set produces an unsigned bundle with a logged
      # reason rather than a confusing Gradle failure — and a local `./gradlew
      # bundleRelease` with no keystore at all still builds.
      - name: Build AAB
        working-directory: android
        run: ./gradlew bundleRelease

      # Gradle signs with whatever config it was handed and says nothing when
      # that config is empty, so "the secrets are set" and "the bundle is
      # signed" are two different facts. Assert the second one here, or the
      # first Play upload is where we find out.
      - name: Verify the AAB is signed
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          AAB=$(ls android/app/build/outputs/bundle/release/*.aab | head -n1)
          if ! jarsigner -verify "$AAB" | grep -q 'jar verified'; then
            echo "::error::$AAB is not signed — a keystore was decoded but gradle did not use it" >&2
            jarsigner -verify "$AAB" >&2 || true
            exit 1
          fi
          echo "✓ $AAB is signed"

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: android/app/build/outputs/bundle/release/*.aab

      - name: Upload to Play Store (internal track)
        if: env.PLAY_SERVICE_ACCOUNT_JSON != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ secrets.ANDROID_PACKAGE_NAME }}
          releaseFiles: android/app/build/outputs/bundle/release/*.aab
          track: internal

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` input — see desktop-release.yml. action-setup reads
      # `packageManager` from package.json and throws on a differing pin.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build static export + sync
        run: pnpm build:mobile ios

      # No `pod install`: Capacitor 8 generates an SPM project (there is no
      # Podfile and no App.xcworkspace), and CocoaPods is not installed on the
      # machines this is developed on either. Dependencies come from
      # ios/App/CapApp-SPM, resolved by xcodebuild.

      - name: Import signing certificate
        if: env.APPLE_CERTIFICATE_BASE64 != ''
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ci-temp-password
        run: |
          echo "$APPLE_CERTIFICATE_BASE64" | base64 -d > /tmp/cert.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import /tmp/cert.p12 -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain

      - name: Archive
        working-directory: ios/App
        run: |
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -archivePath $PWD/build/App.xcarchive \
            -destination 'generic/platform=iOS' \
            archive

      - name: Export IPA
        if: env.APPLE_CERTIFICATE_BASE64 != ''
        working-directory: ios/App
        run: |
          xcodebuild -exportArchive \
            -archivePath $PWD/build/App.xcarchive \
            -exportPath $PWD/build/ipa \
            -exportOptionsPlist ExportOptions.plist

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: ios-archive
          path: ios/App/build/App.xcarchive

      - name: Upload to TestFlight
        if: env.APPLE_API_KEY_BASE64 != ''
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APPLE_API_KEY_BASE64" | base64 -d \
            > ~/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8
          xcrun altool --upload-app \
            --file ios/App/build/ipa/*.ipa \
            --type ios \
            --apiKey "$APPLE_API_KEY_ID" \
            --apiIssuer "$APPLE_API_ISSUER_ID"
