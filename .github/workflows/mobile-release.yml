name: Mobile Release

# Triggered by pushing a tag like v0.1.0 or manual dispatch.
# Builds an Android AAB and an iOS archive. Store uploads are gated
# on secrets — without them the jobs just produce artifacts.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# The API origin baked into the static export. See the long note in
# desktop-release.yml: a repo VARIABLE with a literal fallback, because this was
# read as `secrets.NEXT_PUBLIC_API_URL`, that secret is not set, and an unset
# secret expands to the empty string rather than failing — which for a
# build-time-inlined NEXT_PUBLIC_* means shipping an app permanently pointed at
# nothing. Same read as the main pipeline settled on in 33f4683.
#
# scripts/build-mobile.mjs owns the assertion here: it refuses to run with this
# unset, rejects a value carrying a path, and afterwards greps the emitted
# chunks for the literal. So an empty or misspelled value fails the job rather
# than producing an .aab, and the workflow needs no separate check.
env:
  NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'https://api.trackyourtime.dev' }}

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build static export
        run: pnpm build:mobile android

      - name: Decode signing keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/app
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore

      # Signed when the keystore step above wrote one, unsigned otherwise.
      # `signingConfigs.release` in android/app/build.gradle reads exactly these
      # three names out of the environment, and is conditional on
      # android/app/release.keystore existing — so a local `./gradlew
      # bundleRelease` with no keystore still builds, it just produces an
      # artifact Play will not take.
      - name: Build AAB
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      # Gradle signs with whatever config it was handed and says nothing when
      # that config is empty, so "the secrets are set" and "the bundle is
      # signed" are two different facts. Assert the second one here, or the
      # first Play upload is where we find out.
      - name: Verify the AAB is signed
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          AAB=$(ls android/app/build/outputs/bundle/release/*.aab | head -n1)
          if ! jarsigner -verify "$AAB" | grep -q 'jar verified'; then
            echo "::error::$AAB is not signed — a keystore was decoded but gradle did not use it" >&2
            jarsigner -verify "$AAB" >&2 || true
            exit 1
          fi
          echo "✓ $AAB is signed"

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: android/app/build/outputs/bundle/release/*.aab

      - name: Upload to Play Store (internal track)
        if: env.PLAY_SERVICE_ACCOUNT_JSON != ''
        uses: r0adkll/upload-google-play@v1
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ secrets.ANDROID_PACKAGE_NAME }}
          releaseFiles: android/app/build/outputs/bundle/release/*.aab
          track: internal

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build static export + sync
        run: pnpm build:mobile ios

      # No `pod install`: Capacitor 8 generates an SPM project (there is no
      # Podfile and no App.xcworkspace), and CocoaPods is not installed on the
      # machines this is developed on either. Dependencies come from
      # ios/App/CapApp-SPM, resolved by xcodebuild.

      - name: Import signing certificate
        if: env.APPLE_CERTIFICATE_BASE64 != ''
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ci-temp-password
        run: |
          echo "$APPLE_CERTIFICATE_BASE64" | base64 -d > /tmp/cert.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import /tmp/cert.p12 -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain

      - name: Archive
        working-directory: ios/App
        run: |
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -archivePath $PWD/build/App.xcarchive \
            -destination 'generic/platform=iOS' \
            archive

      - name: Export IPA
        if: env.APPLE_CERTIFICATE_BASE64 != ''
        working-directory: ios/App
        run: |
          xcodebuild -exportArchive \
            -archivePath $PWD/build/App.xcarchive \
            -exportPath $PWD/build/ipa \
            -exportOptionsPlist ExportOptions.plist

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: ios-archive
          path: ios/App/build/App.xcarchive

      - name: Upload to TestFlight
        if: env.APPLE_API_KEY_BASE64 != ''
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APPLE_API_KEY_BASE64" | base64 -d \
            > ~/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8
          xcrun altool --upload-app \
            --file ios/App/build/ipa/*.ipa \
            --type ios \
            --apiKey "$APPLE_API_KEY_ID" \
            --apiIssuer "$APPLE_API_ISSUER_ID"
