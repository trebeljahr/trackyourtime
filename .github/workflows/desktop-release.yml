name: Desktop Release

# Builds every desktop artifact in one matrix, one leg per distribution channel
# (docs/desktop-app-plan.md, Stage 6; docs/deploy.md → "Desktop release"):
#
#   mac        Developer ID dmg + zip, arm64 and x64, hardened runtime, notarized
#   mas        Mac App Store pkg, universal, sandboxed
#   win        NSIS installer, x64 + arm64 in one exe
#   win-store  AppX for the Microsoft Store (Partner Center signs it)
#   linux-x64  AppImage, deb, rpm, tar.gz (Flathub's input) and snap
#   linux-arm64 the same minus the snap, on an arm64 runner
#
# The snap is x64 only, and that is a property of electron-builder, not a
# preference (measured on tag v0.1.0, run 36108136377; docs/desktop-app-plan.md
# → Stage 6, "snap on linux-arm64"). electron-builder assembles a snap from a
# prebuilt template — no snapcraft run at all — but that template is published
# for amd64 and armhf only (the two URLs are hardcoded in app-builder), so
# `isUseTemplateApp` in app-builder-lib/out/targets/snap.js is true for x64 and
# armv7l and false for arm64. On arm64 it therefore writes a snapcraft.yaml and
# shells out to real snapcraft (with --destructive-mode already, so LXD was
# never the problem), and snapcraft 9 — what `snap install snapcraft` now gives
# — refuses the template's `base: core20`. The base cannot simply move: it is
# one static config value shared with the x64 template path, where core20 is
# what the template's staged libraries and gnome-3-28-1804 content plug
# actually are. See electron-builder.config.mjs → `snap`.
#
# The arm64 runner stays: rpm, deb and AppImage are built natively here rather
# than cross-built, which is the same trade the other legs make.
#
# On a v* tag the linux-x64 leg also uploads its snap to the Snap Store's
# `candidate` channel, when SNAPCRAFT_STORE_CREDENTIALS is set; with it unset
# it prints a notice and stays green. Only that leg, because only that leg
# builds a snap. Promotion to `stable` and the Flathub
# pull request are manual (docs/linux-stores.md).
#
# Signing follows the Android rule: no secrets for a channel builds an artifact
# whose file name says -unsigned; a complete set signs and the signature is
# verified; anything in between fails the leg before the export is built
# (scripts/lib/desktop-release.mjs, resolveSigning). A Mac App Store build
# without its secrets packages the .app to check the config and uploads
# nothing, since there is no unsigned pkg to submit; a Microsoft Store build
# without its Partner Center identity is skipped with a notice.
#
# A dispatch keeps everything as Actions artifacts. A `v*` tag also runs the
# `draft-release` job (Stage 7): it attaches the signed downloads and their
# update feeds (latest-mac.yml, latest.yml, latest-linux*.yml) to a DRAFT
# GitHub Release. Nothing is published here. Installed apps only see a release
# once a person publishes the draft, because electron-updater reads the latest
# PUBLISHED release. Store uploads stay manual.
#
# Staged rollout: the feeds can carry `stagingPercentage`, so only that share
# of installs is offered the release (docs/deploy.md → "Staged rollout"). The
# value is the dispatch input, else the repo variable
# DESKTOP_STAGING_PERCENTAGE, else nothing — every install, as before. It only
# matters on a tag (a push, or a dispatch run from the tag), because only then
# is a draft written. `pnpm desktop:rollout` changes it after publishing.

on:
  # build-desktop.mjs refuses a tag that does not match package.json's version.
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      staging_percentage:
        description: "Share of installs offered the update, 0-100 (empty: the DESKTOP_STAGING_PERCENTAGE variable, else everybody). Used when run from a v* tag."
        required: false
        default: ""
        type: string

permissions:
  contents: read

# The API origin the static export is built against: a repo VARIABLE with a
# literal fallback, never a secret (an unset secret expands to "" and would ship
# an app that talks to no API). Same read as build-and-deploy.yml.
env:
  NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'https://api.trackyourtime.dev' }}
  # Error reporting, baked in the same way: a repo VARIABLE, empty by default.
  # Empty means the reporting SDK is not in the bundle at all
  # (packages/client/src/lib/error-reporting/reporter.ts); the "Error
  # reporting" step below says which it was. docs/deploy.md → Error reporting.
  NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}

jobs:
  # Validates the staging percentage in seconds, before the builds: a typo
  # ("1O") fails here and nothing is built, rather than an hour later in
  # draft-release. Empty is not a problem; it is a full rollout, and says so
  # in a notice.
  rollout:
    name: staging percentage
    runs-on: ubuntu-24.04
    outputs:
      percentage: ${{ steps.check.outputs.percentage }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Through the environment, never interpolated into the script: a
      # dispatch input is free text.
      - name: Check the staging percentage
        id: check
        env:
          RAW: ${{ inputs.staging_percentage || vars.DESKTOP_STAGING_PERCENTAGE }}
        run: node scripts/desktop-rollout.mjs --check "$RAW"

  build:
    name: ${{ matrix.channel }}
    needs: rollout
    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: mac
            signing-channel: mac
            os: macos-latest
            builder: --mac dmg zip --arm64 --x64
            artifacts: |
              release/*.dmg
              release/*.zip
              release/*.blockmap
              release/latest-mac.yml
          - channel: mas
            signing-channel: mas
            os: macos-latest
            builder: --mac mas --universal
            # electron-builder writes the MAS pkg into the target's own output
            # directory (release/mas-universal/), not release/ — it comes from
            # createMasInstaller, not from a normal target.
            artifacts: |
              release/mas*/*.pkg
          - channel: win
            signing-channel: win
            os: windows-latest
            builder: --win nsis --x64 --arm64
            artifacts: |
              release/*.exe
              release/*.blockmap
              release/latest.yml
          - channel: win-store
            signing-channel: win-store
            os: windows-latest
            builder: --win appx --x64 --arm64
            artifacts: |
              release/*.appx
          - channel: linux-x64
            signing-channel: linux
            os: ubuntu-24.04
            builder: --linux AppImage deb rpm tar.gz snap --x64
            artifacts: |
              release/*.AppImage
              release/*.deb
              release/*.rpm
              release/*.tar.gz
              release/*.snap
              release/latest-linux.yml
          - channel: linux-arm64
            signing-channel: linux
            os: ubuntu-24.04-arm
            # No snap: electron-builder has no arm64 template and snapcraft 9
            # refuses the core20 one it falls back to (see the header).
            builder: --linux AppImage deb rpm tar.gz --arm64
            artifacts: |
              release/*.AppImage
              release/*.deb
              release/*.rpm
              release/*.tar.gz
              release/latest-linux-arm64.yml

    runs-on: ${{ matrix.os }}

    # Job-level, so step `if:` guards can read them (a step's own `env:` is not
    # in scope for its `if:`). Each channel sees only its own certificate:
    # electron-builder reads CSC_LINK for both Apple channels, and the two are
    # different certificates. Names on the right are the GitHub secrets
    # (docs/deploy.md → "Desktop release" → secrets).
    env:
      CSC_LINK: ${{ matrix.channel == 'mac' && secrets.MAC_CSC_LINK || matrix.channel == 'mas' && secrets.MAS_CSC_LINK || '' }}
      CSC_KEY_PASSWORD: ${{ matrix.channel == 'mac' && secrets.MAC_CSC_KEY_PASSWORD || matrix.channel == 'mas' && secrets.MAS_CSC_KEY_PASSWORD || '' }}
      # The App Store Connect API key the iOS release uses notarizes too. It is
      # decoded to a file below; APPLE_API_KEY is that file's path.
      APPLE_API_KEY_BASE64: ${{ matrix.channel == 'mac' && secrets.APPLE_API_KEY_BASE64 || '' }}
      APPLE_API_KEY_ID: ${{ matrix.channel == 'mac' && secrets.APPLE_API_KEY_ID || '' }}
      APPLE_API_ISSUER: ${{ matrix.channel == 'mac' && secrets.APPLE_API_ISSUER_ID || '' }}
      APPLE_TEAM_ID: ${{ matrix.channel == 'mas' && secrets.APPLE_TEAM_ID || '' }}
      MAS_PROVISIONING_PROFILE_BASE64: ${{ matrix.channel == 'mas' && secrets.MAS_PROVISIONING_PROFILE_BASE64 || '' }}
      WIN_CSC_LINK: ${{ matrix.channel == 'win' && secrets.WIN_CSC_LINK || '' }}
      WIN_CSC_KEY_PASSWORD: ${{ matrix.channel == 'win' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
      AZURE_TENANT_ID: ${{ matrix.channel == 'win' && secrets.AZURE_TENANT_ID || '' }}
      AZURE_CLIENT_ID: ${{ matrix.channel == 'win' && secrets.AZURE_CLIENT_ID || '' }}
      AZURE_CLIENT_SECRET: ${{ matrix.channel == 'win' && secrets.AZURE_CLIENT_SECRET || '' }}
      AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ matrix.channel == 'win' && secrets.AZURE_TRUSTED_SIGNING_ENDPOINT || '' }}
      AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ matrix.channel == 'win' && secrets.AZURE_TRUSTED_SIGNING_ACCOUNT || '' }}
      AZURE_TRUSTED_SIGNING_PROFILE: ${{ matrix.channel == 'win' && secrets.AZURE_TRUSTED_SIGNING_PROFILE || '' }}
      AZURE_TRUSTED_SIGNING_PUBLISHER_NAME: ${{ matrix.channel == 'win' && secrets.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME || '' }}
      # The Snap Store credential, on the Linux legs only. One secret, so
      # "not set" is a repo that does not publish to the Snap Store: the
      # publish step then prints a notice and the leg stays green
      # (scripts/lib/desktop-release.mjs, snapPublishPlan).
      SNAPCRAFT_STORE_CREDENTIALS: ${{ matrix.signing-channel == 'linux' && secrets.SNAPCRAFT_STORE_CREDENTIALS || '' }}
      # Not secrets: Partner Center shows them on the product identity page.
      WINDOWS_STORE_IDENTITY_NAME: ${{ vars.WINDOWS_STORE_IDENTITY_NAME }}
      WINDOWS_STORE_PUBLISHER: ${{ vars.WINDOWS_STORE_PUBLISHER }}
      WINDOWS_STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.WINDOWS_STORE_PUBLISHER_DISPLAY_NAME }}

    steps:
      - uses: actions/checkout@v7

      # Before the signing check, which reads APPLE_API_KEY and
      # MAS_PROVISIONING_PROFILE as the paths these write.
      - name: Decode the Apple key files
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if [ -n "$APPLE_API_KEY_BASE64" ]; then
            printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
            echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          fi
          if [ -n "$MAS_PROVISIONING_PROFILE_BASE64" ]; then
            printf '%s' "$MAS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/embedded.provisionprofile"
            echo "MAS_PROVISIONING_PROFILE=$RUNNER_TEMP/embedded.provisionprofile" >> "$GITHUB_ENV"
          fi

      # The Mac App Store pkg's CFBundleVersion (electron-builder.config.mjs,
      # mas.bundleVersion). App Store Connect refuses a build number it has
      # seen for a version, so it grows per run and per re-run, the way
      # mobile-release.yml numbers the iOS build. `pnpm desktop:mas-upload`
      # sends the result to App Store Connect.
      - name: Number the Mac App Store build
        if: matrix.channel == 'mas'
        shell: bash
        run: echo "DESKTOP_BUILD_NUMBER=$((GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))" >> "$GITHUB_ENV"

      # Decides signed / unsigned / store / skip before anything slow runs, with
      # the same function build-desktop.mjs calls. A partial set fails here.
      #
      # It runs before setup-node, on whatever Node the runner ships, so that
      # the pnpm cache below can be gated on its answer. That is safe because
      # the script reads environment variables and imports one pure module —
      # `node:fs` and `scripts/lib/desktop-release.mjs`, no dependencies and
      # nothing version-sensitive. Everything that cares which Node it gets
      # (the Electron download) runs after setup-node.
      - name: Check the signing secrets
        id: signing
        shell: bash
        run: node scripts/desktop-signing-mode.mjs ${{ matrix.signing-channel }}

      # No `version:` input: pnpm/action-setup reads `packageManager`.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Node 26's electron download leaves a truncated binary (CLAUDE.md).
          node-version: 24
          # Only when this leg installs. A skipped leg never runs `pnpm
          # install`, so the pnpm store does not exist, and setup-node's
          # post-job cache SAVE then fails the whole job with "Path Validation
          # Error: Path(s) specified in the action for caching do(es) not
          # exist" — which is how win-store failed on tag v0.1.0 even though it
          # had correctly decided to skip and had built nothing. There is one
          # rule for skipping and it is the step above, not a copy of its
          # condition here.
          cache: ${{ steps.signing.outputs.mode != 'skip' && 'pnpm' || '' }}

      - name: Install deps
        if: steps.signing.outputs.mode != 'skip'
        run: pnpm install --frozen-lockfile

      # rpm builds need rpmbuild, on both Linux legs.
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      # Only the leg that builds a snap, and only as a fallback: electron-builder
      # assembles the x64 snap from its prebuilt template and never invokes
      # snapcraft, so this normally goes unused. It stays because the template
      # path is an electron-builder internal (`isUseTemplateApp`) that a config
      # change can switch off — adding `snap.buildPackages`, or a
      # `stagePackages` that differs from the default, drops this leg onto real
      # snapcraft. Without the tool that is "snapcraft is not installed"; with
      # it, the core20 refusal the arm64 leg hit, which is the louder failure.
      - name: Install snapcraft
        if: matrix.channel == 'linux-x64'
        run: sudo snap install snapcraft --classic

      # One script, the same one `pnpm electron:build` runs: export into
      # out-desktop (API URL asserted in a chunk), bundle electron/src,
      # icons, electron-builder with --publish never, then the asar listing
      # (no @capacitor, nothing stray) and the version inside every package
      # against package.json (and, on a tag, the tag against package.json).
      # Opt-in per build, so a release that reports nothing must say so in
      # its log rather than look like one that does.
      - name: Error reporting
        if: steps.signing.outputs.mode != 'skip'
        shell: bash
        run: |
          if [ -z "${NEXT_PUBLIC_SENTRY_DSN:-}" ]; then
            echo "::notice::NEXT_PUBLIC_SENTRY_DSN is not set — this build reports no errors. See docs/deploy.md → Error reporting."
          else
            echo "Error reporting is on: NEXT_PUBLIC_SENTRY_DSN is set."
          fi

      - name: Build and package
        if: steps.signing.outputs.mode != 'skip'
        shell: bash
        run: node scripts/build-desktop.mjs --channel ${{ matrix.signing-channel }} --package ${{ matrix.builder }}

      # Building a package does not prove it starts on a clean machine. Run
      # each native Linux package in an isolated install before it can enter
      # the draft release (including its declared dependencies and runtime).
      - name: Smoke-test Linux packages
        if: runner.os == 'Linux' && steps.signing.outputs.mode != 'skip'
        run: pnpm test:desktop:packages

      - name: Upload Linux package QA
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-qa-${{ matrix.channel }}
          path: test-results/linux-packages/
          if-no-files-found: ignore

      # An unsigned leg must say so in every file a person could download, and a
      # signed leg must not: the names come from TRACKYOURTIME_UNSIGNED, which
      # build-desktop.mjs sets from the same decision as above.
      - name: Check the artifact names match the signing
        if: steps.signing.outputs.mode == 'signed' || steps.signing.outputs.mode == 'unsigned'
        shell: bash
        run: |
          shopt -s nullglob
          files=(release/*.dmg release/*.zip release/*.exe release/*.pkg)
          if [ "${{ matrix.signing-channel }}" = "linux" ]; then exit 0; fi
          [ ${#files[@]} -gt 0 ] || [ "${{ matrix.channel }}" = "mas" ] || { echo "::error::No installer was written."; exit 1; }
          for f in "${files[@]}"; do
            case "$f" in
              *-unsigned.*) [ "${{ steps.signing.outputs.mode }}" = "unsigned" ] || { echo "::error::$f is named unsigned in a signed build"; exit 1; } ;;
              *) [ "${{ steps.signing.outputs.mode }}" = "signed" ] || { echo "::error::$f is not named -unsigned but nothing signed it"; exit 1; } ;;
            esac
          done

      # ── Signature verification ─────────────────────────────────────
      - name: Verify the Developer ID signature and notarization
        if: matrix.channel == 'mac' && steps.signing.outputs.mode == 'signed'
        shell: bash
        run: |
          set -euo pipefail
          for app in release/mac*/"Track Your Time.app"; do
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign -d --entitlements - "$app" | grep -q "com.apple.security.cs.allow-jit"
            codesign -dv "$app" 2>&1 | grep -q "flags=0x10000(runtime)"
            spctl --assess --type execute --verbose=2 "$app"
            xcrun stapler validate "$app"
          done
          # The dmg itself is not signed (electron-builder's dmg.sign defaults
          # to false); what Gatekeeper checks is the stapled app inside it.

      - name: Verify the Mac App Store signature
        if: matrix.channel == 'mas' && steps.signing.outputs.mode == 'signed'
        shell: bash
        run: |
          set -euo pipefail
          for app in release/mas*/"Track Your Time.app"; do
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign -d --entitlements - "$app" | grep -q "com.apple.security.app-sandbox"
            codesign -d --entitlements - "$app" | grep -q "$APPLE_TEAM_ID.com.ricoslabs.trackyourtime"
            test -f "$app/Contents/embedded.provisionprofile"
          done
          # Under release/mas*/, not release/ — see the matrix comment.
          shopt -s nullglob
          pkgs=(release/mas*/*.pkg)
          [ ${#pkgs[@]} -gt 0 ] || { echo "::error::No MAS pkg was written. A signed mas build must produce one."; exit 1; }
          for pkg in "${pkgs[@]}"; do
            echo "$pkg"
            pkgutil --check-signature "$pkg"
          done

      - name: Verify the Windows signature
        if: matrix.channel == 'win' && steps.signing.outputs.mode == 'signed'
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -Last 1
          if (-not $signtool) { throw "signtool.exe not found" }
          $files = @(Get-ChildItem release -Filter *.exe) + @(Get-ChildItem release -Recurse -Filter "Track Your Time.exe")
          foreach ($f in $files) {
            & $signtool.FullName verify /pa /v $f.FullName
            if ($LASTEXITCODE -ne 0) { throw "signtool verify failed for $($f.FullName)" }
          }

      # ── Checksums and upload ───────────────────────────────────────
      - name: Write checksums
        if: steps.signing.outputs.mode != 'skip'
        shell: bash
        run: |
          shopt -s nullglob
          cd release
          files=(*.dmg *.zip *.pkg mas*/*.pkg *.exe *.appx *.AppImage *.deb *.rpm *.tar.gz *.snap)
          if [ ${#files[@]} -gt 0 ]; then
            if command -v sha256sum >/dev/null; then sha256sum "${files[@]}"; else shasum -a 256 "${files[@]}"; fi > SHA256SUMS-${{ matrix.channel }}.txt
            cat SHA256SUMS-${{ matrix.channel }}.txt
          fi

      # ── Snap Store ─────────────────────────────────────────────────
      # Uploads this leg's one .snap to the `candidate` channel on a v* tag,
      # and only when SNAPCRAFT_STORE_CREDENTIALS is set. Never `stable`: a
      # person publishes the draft release and promotes the snap, so a tag run
      # cannot hand the app to every install on its own
      # (docs/linux-stores.md → "Promote the snap"). The draft-release job
      # still attaches no snap.
      #
      # linux-x64 only: it is the one leg that builds a snap, and
      # snap-publish.mjs requires exactly one .snap in the directory — on arm64
      # it would find none and fail the leg as soon as the credential is set.
      - name: Upload to the Snap Store
        if: matrix.channel == 'linux-x64' && steps.signing.outputs.mode != 'skip'
        shell: bash
        run: node scripts/snap-publish.mjs --dir release

      - name: Upload artifacts
        if: steps.signing.outputs.mode != 'skip'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.channel }}-${{ steps.signing.outputs.mode }}
          path: |
            ${{ matrix.artifacts }}
            release/SHA256SUMS-${{ matrix.channel }}.txt
          # A Mac App Store build without its secrets writes no pkg.
          if-no-files-found: ${{ matrix.channel == 'mas' && steps.signing.outputs.mode == 'unsigned' && 'ignore' || 'error' }}

  # ── Draft GitHub Release (tags only) ─────────────────────────────────
  # Runs only when every leg succeeded. scripts/desktop-release-draft.mjs
  # decides what is attached (lib/desktop-release.mjs → releasePlan): signed
  # mac and win downloads, every Linux download, and each feed, after checking
  # that every file a feed names is attached with the sha512 and size it
  # states. `-unsigned` files and store packages are never attached; an
  # unsigned mac or win leg is a warning on the run, so the person publishing
  # sees which platform is missing. A release that is already published is
  # never touched: a new build needs a new tag.
  draft-release:
    name: draft release
    if: github.ref_type == 'tag'
    needs: [rollout, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
      # Normalised by the rollout job: a number from 0 to 99, or empty for
      # every install (100 is written as no key; scripts/lib/desktop-rollout.mjs).
      STAGING_PERCENTAGE: ${{ needs.rollout.outputs.percentage }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # For electron-updater's js-yaml, which reads the feeds as the app does.
      - name: Install deps
        run: pnpm install --frozen-lockfile --ignore-scripts

      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: artifacts

      # Writes stagingPercentage into each feed, then checks the rewritten
      # feeds against the attached files the same way as the originals.
      - name: Collect the release files
        run: node scripts/desktop-release-draft.mjs --artifacts artifacts --out release-files --staging-percentage "$STAGING_PERCENTAGE"

      - name: Refuse a release that is already published
        shell: bash
        run: |
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" != "true" ]; then
              echo "::error::$TAG is already published. Tag a new version instead of rebuilding a published release."
              exit 1
            fi
            echo "exists=true" >> "$GITHUB_ENV"
          fi

      - name: Create or update the draft
        shell: bash
        run: |
          set -euo pipefail
          version="${TAG#v}"
          if [ -n "$STAGING_PERCENTAGE" ]; then
            offered="$STAGING_PERCENTAGE % of the installed copies that update themselves (a staged rollout; \`pnpm desktop:rollout $TAG <percent>\` changes it)"
          else
            offered="every installed copy that updates itself"
          fi
          printf 'Track Your Time %s.\n\nSee CHANGELOG.md for what changed. Publishing this release offers it to %s.\n' "$version" "$offered" > notes.md
          if [ "${exists:-}" = "true" ]; then
            # A re-dispatch with another staging percentage rewrites the
            # feeds; the notes must name the same share.
            gh release upload "$TAG" release-files/* --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" release-files/* --draft --verify-tag --title "Track Your Time $version" --notes-file notes.md
          fi
          echo "Draft: $(gh release view "$TAG" --json url --jq .url)"
