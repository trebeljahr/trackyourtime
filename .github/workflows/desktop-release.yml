name: Desktop Release

# Manual dispatch only (Actions -> Desktop Release -> Run workflow); a `v*` tag
# does not start it — see the note under `on:`. Each platform job builds an
# Electron app (scripts/build-desktop.mjs + electron-builder.config.mjs), uploads it as an Actions artifact, and pushes it to itch.io via
# butler when ITCH_API_KEY / ITCH_USER / ITCH_GAME are set as repo secrets.
# Nothing it produces is code-signed.

on:
  # No `push: tags` trigger, on purpose. v0.1.0 ships the two self-host images
  # (release.yml) and nothing else: no desktop build is claimed as released,
  # and neither an itch.io key nor a macOS/Windows signing identity exists on
  # this repo. Left on the tag, this workflow would have put three red jobs
  # next to the release, for artifacts nobody was going to download.
  #
  # Before adding `push: { tags: ["v*"] }` back above workflow_dispatch:
  #   - decide how the builds are distributed: itch.io needs the ITCH_API_KEY,
  #     ITCH_USER and ITCH_GAME secrets; GitHub Releases would need
  #     `permissions: contents: write` AND dropping `--publish never` below
  #   - sign them: a macOS Developer ID certificate plus notarization
  #     credentials (electron-builder reads CSC_LINK, CSC_KEY_PASSWORD, APPLE_ID,
  #     APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID) and a Windows certificate
  #     (WIN_CSC_LINK, WIN_CSC_KEY_PASSWORD), exposed to the Package step —
  #     unsigned builds are blocked by Gatekeeper and flagged by SmartScreen
  #   - the butler push tags `--userversion` from GITHUB_REF_NAME, which is the
  #     tag on a tag run but the branch name ("main") on a dispatch
  #   - run a dispatch of this workflow green on all three legs first
  workflow_dispatch:

# The API origin the static export is built against.
#
# A repo VARIABLE with a literal fallback, not a secret — an API origin is not
# one, and reading it as one was worse than merely wrong: `secrets.NEXT_PUBLIC_API_URL`
# is not set on this repo, so it expanded to the empty string and every `v*`
# tag would have packaged an app built against nothing. Next inlines
# NEXT_PUBLIC_* at build time, so that binary cannot be retargeted after the
# fact — it is downloaded, installed, and permanently talks to no API.
#
# The main pipeline shipped exactly this for months and settled on the form
# below in 33f4683 (a `vars.` read that silently produced empty-API images,
# plus a literal fallback so an unset variable cannot do it again). Same read
# here, so the two cannot drift apart.
env:
  NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'https://api.trackyourtime.dev' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: mac
            artifact-glob: "release/*.zip"
            butler-channel: mac
          - os: windows-latest
            target: win
            artifact-glob: "release/*.exe"
            butler-channel: win
          - os: ubuntu-latest
            target: linux
            artifact-glob: "release/*.AppImage"
            butler-channel: linux

    runs-on: ${{ matrix.os }}

    # Job-level rather than step-level, so the butler `if:` guards below can see
    # it. A step's own `env:` is not in scope for that step's `if:`, so with the
    # key declared only on the steps they were skipped even with the secret set.
    env:
      ITCH_API_KEY: ${{ secrets.ITCH_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      # No `version:` input. pnpm/action-setup@v4 reads `packageManager` from
      # the root package.json, and an explicit `version: 11` next to
      # "pnpm@11.1.2" is not treated as compatible: the action throws
      # "Multiple versions of pnpm specified" and every leg died here.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      # One script builds the desktop export (packages/client/out-desktop), checks
      # that NEXT_PUBLIC_API_URL reached the bundle and that no HTML uses a
      # relative "./_next" prefix, and bundles electron/src into electron/dist.
      # The app serves that export from the privileged app://- scheme, so the
      # assets are root-absolute like the web build's.
      - name: Build the desktop export and main process
        run: node scripts/build-desktop.mjs

      # build/icon.icns and build/icon.ico are generated from build/icon.png and
      # gitignored as such (.gitignore: "source of truth is build/icon.png"), but
      # electron-builder.config.mjs names all three. Without this
      # step a mac or windows packaging run fails on a missing icon; linux uses
      # the .png directly and needs nothing, so this is a no-op there.
      - name: Generate desktop icons
        run: pnpm icons:desktop

      # `--publish never`, explicitly. With GH_TOKEN set, electron-builder
      # publishes on its own: on a tag (or a dispatch) it picks the github
      # provider and tries to create a release, which this repo's read-only
      # workflow token answers with a 403 — a red job after a good build. The
      # artifacts reach users through upload-artifact and butler below, never
      # through electron-builder.
      - name: Package (electron-builder)
        run: pnpm exec electron-builder --config electron-builder.config.mjs --${{ matrix.target }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: ${{ matrix.artifact-glob }}

      - name: Install butler (itch.io)
        if: env.ITCH_API_KEY != ''
        shell: bash
        run: |
          case "${{ matrix.os }}" in
            macos-latest)  URL=https://broth.itch.ovh/butler/darwin-amd64/LATEST/archive/default ;;
            ubuntu-latest) URL=https://broth.itch.ovh/butler/linux-amd64/LATEST/archive/default ;;
            windows-latest) URL=https://broth.itch.ovh/butler/windows-amd64/LATEST/archive/default ;;
          esac
          curl -L -o butler.zip "$URL"
          unzip butler.zip -d butler-bin
          echo "$PWD/butler-bin" >> "$GITHUB_PATH"

      - name: Push to itch.io
        if: env.ITCH_API_KEY != ''
        shell: bash
        env:
          BUTLER_API_KEY: ${{ secrets.ITCH_API_KEY }}
          ITCH_USER: ${{ secrets.ITCH_USER }}
          ITCH_GAME: ${{ secrets.ITCH_GAME }}
        run: |
          ARTIFACT=$(ls ${{ matrix.artifact-glob }} | head -n1)
          butler push "$ARTIFACT" "$ITCH_USER/$ITCH_GAME:${{ matrix.butler-channel }}" \
            --userversion "${GITHUB_REF_NAME#v}"
