name: Desktop Release

# Builds every desktop artifact in one matrix, one leg per distribution channel
# (docs/desktop-app-plan.md, Stage 6; docs/deploy.md → "Desktop release"):
#
#   mac        Developer ID dmg + zip, arm64 and x64, hardened runtime, notarized
#   mas        Mac App Store pkg, universal, sandboxed
#   win        NSIS installer, x64 + arm64 in one exe
#   win-store  AppX for the Microsoft Store (Partner Center signs it)
#   linux-x64  AppImage, deb, rpm, tar.gz (Flathub's input) and snap
#   linux-arm64 the same on an arm64 runner (snapcraft cannot cross-build)
#
# Signing follows the Android rule: no secrets for a channel builds an artifact
# whose file name says -unsigned; a complete set signs and the signature is
# verified; anything in between fails the leg before the export is built
# (scripts/lib/desktop-release.mjs, resolveSigning). A Mac App Store build
# without its secrets packages the .app to check the config and uploads
# nothing, since there is no unsigned pkg to submit; a Microsoft Store build
# without its Partner Center identity is skipped with a notice.
#
# A dispatch keeps everything as Actions artifacts. A `v*` tag also runs the
# `draft-release` job (Stage 7): it attaches the signed downloads and their
# update feeds (latest-mac.yml, latest.yml, latest-linux*.yml) to a DRAFT
# GitHub Release. Nothing is published here. Installed apps only see a release
# once a person publishes the draft, because electron-updater reads the latest
# PUBLISHED release. Store uploads stay manual.
#
# Staged rollout: the feeds can carry `stagingPercentage`, so only that share
# of installs is offered the release (docs/deploy.md → "Staged rollout"). The
# value is the dispatch input, else the repo variable
# DESKTOP_STAGING_PERCENTAGE, else nothing — every install, as before. It only
# matters on a tag (a push, or a dispatch run from the tag), because only then
# is a draft written. `pnpm desktop:rollout` changes it after publishing.

on:
  # build-desktop.mjs refuses a tag that does not match package.json's version.
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      staging_percentage:
        description: "Share of installs offered the update, 0-100 (empty: the DESKTOP_STAGING_PERCENTAGE variable, else everybody). Used when run from a v* tag."
        required: false
        default: ""
        type: string

permissions:
  contents: read

# The API origin the static export is built against: a repo VARIABLE with a
# literal fallback, never a secret (an unset secret expands to "" and would ship
# an app that talks to no API). Same read as build-and-deploy.yml.
env:
  NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'https://api.trackyourtime.dev' }}

jobs:
  # Validates the staging percentage in seconds, beside the builds rather than
  # after them: a typo ("1O") fails here, not an hour later in draft-release.
  # Empty is not a problem; it is a full rollout, and says so in a notice.
  rollout:
    name: staging percentage
    runs-on: ubuntu-24.04
    outputs:
      percentage: ${{ steps.check.outputs.percentage }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Through the environment, never interpolated into the script: a
      # dispatch input is free text.
      - name: Check the staging percentage
        id: check
        env:
          RAW: ${{ inputs.staging_percentage || vars.DESKTOP_STAGING_PERCENTAGE }}
        run: node scripts/desktop-rollout.mjs --check "$RAW"

  build:
    name: ${{ matrix.channel }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: mac
            signing-channel: mac
            os: macos-latest
            builder: --mac dmg zip --arm64 --x64
            artifacts: |
              release/*.dmg
              release/*.zip
              release/*.blockmap
              release/latest-mac.yml
          - channel: mas
            signing-channel: mas
            os: macos-latest
            builder: --mac mas --universal
            artifacts: |
              release/*.pkg
          - channel: win
            signing-channel: win
            os: windows-latest
            builder: --win nsis --x64 --arm64
            artifacts: |
              release/*.exe
              release/*.blockmap
              release/latest.yml
          - channel: win-store
            signing-channel: win-store
            os: windows-latest
            builder: --win appx --x64 --arm64
            artifacts: |
              release/*.appx
          - channel: linux-x64
            signing-channel: linux
            os: ubuntu-24.04
            builder: --linux AppImage deb rpm tar.gz snap --x64
            artifacts: |
              release/*.AppImage
              release/*.deb
              release/*.rpm
              release/*.tar.gz
              release/*.snap
              release/latest-linux.yml
          - channel: linux-arm64
            signing-channel: linux
            os: ubuntu-24.04-arm
            builder: --linux AppImage deb rpm tar.gz snap --arm64
            artifacts: |
              release/*.AppImage
              release/*.deb
              release/*.rpm
              release/*.tar.gz
              release/*.snap
              release/latest-linux-arm64.yml

    runs-on: ${{ matrix.os }}

    # Job-level, so step `if:` guards can read them (a step's own `env:` is not
    # in scope for its `if:`). Each channel sees only its own certificate:
    # electron-builder reads CSC_LINK for both Apple channels, and the two are
    # different certificates. Names on the right are the GitHub secrets
    # (docs/deploy.md → "Desktop release" → secrets).
    env:
      CSC_LINK: ${{ matrix.channel == 'mac' && secrets.MAC_CSC_LINK || matrix.channel == 'mas' && secrets.MAS_CSC_LINK || '' }}
      CSC_KEY_PASSWORD: ${{ matrix.channel == 'mac' && secrets.MAC_CSC_KEY_PASSWORD || matrix.channel == 'mas' && secrets.MAS_CSC_KEY_PASSWORD || '' }}
      # The App Store Connect API key the iOS release uses notarizes too. It is
      # decoded to a file below; APPLE_API_KEY is that file's path.
      APPLE_API_KEY_BASE64: ${{ matrix.channel == 'mac' && secrets.APPLE_API_KEY_BASE64 || '' }}
      APPLE_API_KEY_ID: ${{ matrix.channel == 'mac' && secrets.APPLE_API_KEY_ID || '' }}
      APPLE_API_ISSUER: ${{ matrix.channel == 'mac' && secrets.APPLE_API_ISSUER_ID || '' }}
      APPLE_TEAM_ID: ${{ matrix.channel == 'mas' && secrets.APPLE_TEAM_ID || '' }}
      MAS_PROVISIONING_PROFILE_BASE64: ${{ matrix.channel == 'mas' && secrets.MAS_PROVISIONING_PROFILE_BASE64 || '' }}
      WIN_CSC_LINK: ${{ matrix.channel == 'win' && secrets.WIN_CSC_LINK || '' }}
      WIN_CSC_KEY_PASSWORD: ${{ matrix.channel == 'win' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
      AZURE_TENANT_ID: ${{ matrix.channel == 'win' && secrets.AZURE_TENANT_ID || '' }}
      AZURE_CLIENT_ID: ${{ matrix.channel == 'win' && secrets.AZURE_CLIENT_ID || '' }}
      AZURE_CLIENT_SECRET: ${{ matrix.channel == 'win' && secrets.AZURE_CLIENT_SECRET || '' }}
      AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ matrix.channel == 'win' && secrets.AZURE_TRUSTED_SIGNING_ENDPOINT || '' }}
      AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ matrix.channel == 'win' && secrets.AZURE_TRUSTED_SIGNING_ACCOUNT || '' }}
      AZURE_TRUSTED_SIGNING_PROFILE: ${{ matrix.channel == 'win' && secrets.AZURE_TRUSTED_SIGNING_PROFILE || '' }}
      AZURE_TRUSTED_SIGNING_PUBLISHER_NAME: ${{ matrix.channel == 'win' && secrets.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME || '' }}
      # Not secrets: Partner Center shows them on the product identity page.
      WINDOWS_STORE_IDENTITY_NAME: ${{ vars.WINDOWS_STORE_IDENTITY_NAME }}
      WINDOWS_STORE_PUBLISHER: ${{ vars.WINDOWS_STORE_PUBLISHER }}
      WINDOWS_STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.WINDOWS_STORE_PUBLISHER_DISPLAY_NAME }}

    steps:
      - uses: actions/checkout@v4

      # No `version:` input: pnpm/action-setup reads `packageManager`.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Node 26's electron download leaves a truncated binary (CLAUDE.md).
          node-version: 24
          cache: pnpm

      - name: Decode the Apple key files
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if [ -n "$APPLE_API_KEY_BASE64" ]; then
            printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
            echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          fi
          if [ -n "$MAS_PROVISIONING_PROFILE_BASE64" ]; then
            printf '%s' "$MAS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/embedded.provisionprofile"
            echo "MAS_PROVISIONING_PROFILE=$RUNNER_TEMP/embedded.provisionprofile" >> "$GITHUB_ENV"
          fi

      # Decides signed / unsigned / store before anything slow runs, with the
      # same function build-desktop.mjs calls. A partial set fails here.
      - name: Check the signing secrets
        id: signing
        shell: bash
        run: node scripts/desktop-signing-mode.mjs ${{ matrix.signing-channel }}

      - name: Install deps
        if: steps.signing.outputs.mode != 'skip'
        run: pnpm install --frozen-lockfile

      # rpm builds need rpmbuild; the snap target needs snapcraft (LXD is not
      # used: electron-builder builds from its prebuilt template).
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm
          sudo snap install snapcraft --classic

      # One script, the same one `pnpm electron:build` runs: export into
      # out-desktop (API URL asserted in a chunk), bundle electron/src,
      # icons, electron-builder with --publish never, then the asar listing
      # (no @capacitor, nothing stray) and the version inside every package
      # against package.json (and, on a tag, the tag against package.json).
      - name: Build and package
        if: steps.signing.outputs.mode != 'skip'
        shell: bash
        run: node scripts/build-desktop.mjs --channel ${{ matrix.signing-channel }} --package ${{ matrix.builder }}

      # An unsigned leg must say so in every file a person could download, and a
      # signed leg must not: the names come from TRACKYOURTIME_UNSIGNED, which
      # build-desktop.mjs sets from the same decision as above.
      - name: Check the artifact names match the signing
        if: steps.signing.outputs.mode == 'signed' || steps.signing.outputs.mode == 'unsigned'
        shell: bash
        run: |
          shopt -s nullglob
          files=(release/*.dmg release/*.zip release/*.exe release/*.pkg)
          if [ "${{ matrix.signing-channel }}" = "linux" ]; then exit 0; fi
          [ ${#files[@]} -gt 0 ] || [ "${{ matrix.channel }}" = "mas" ] || { echo "::error::No installer was written."; exit 1; }
          for f in "${files[@]}"; do
            case "$f" in
              *-unsigned.*) [ "${{ steps.signing.outputs.mode }}" = "unsigned" ] || { echo "::error::$f is named unsigned in a signed build"; exit 1; } ;;
              *) [ "${{ steps.signing.outputs.mode }}" = "signed" ] || { echo "::error::$f is not named -unsigned but nothing signed it"; exit 1; } ;;
            esac
          done

      # ── Signature verification ─────────────────────────────────────
      - name: Verify the Developer ID signature and notarization
        if: matrix.channel == 'mac' && steps.signing.outputs.mode == 'signed'
        shell: bash
        run: |
          set -euo pipefail
          for app in release/mac*/"Track Your Time.app"; do
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign -d --entitlements - "$app" | grep -q "com.apple.security.cs.allow-jit"
            codesign -dv "$app" 2>&1 | grep -q "flags=0x10000(runtime)"
            spctl --assess --type execute --verbose=2 "$app"
            xcrun stapler validate "$app"
          done
          # The dmg itself is not signed (electron-builder's dmg.sign defaults
          # to false); what Gatekeeper checks is the stapled app inside it.

      - name: Verify the Mac App Store signature
        if: matrix.channel == 'mas' && steps.signing.outputs.mode == 'signed'
        shell: bash
        run: |
          set -euo pipefail
          for app in release/mas*/"Track Your Time.app"; do
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign -d --entitlements - "$app" | grep -q "com.apple.security.app-sandbox"
            codesign -d --entitlements - "$app" | grep -q "$APPLE_TEAM_ID.com.ricoslabs.trackyourtime"
            test -f "$app/Contents/embedded.provisionprofile"
          done
          ls release/*.pkg
          for pkg in release/*.pkg; do pkgutil --check-signature "$pkg"; done

      - name: Verify the Windows signature
        if: matrix.channel == 'win' && steps.signing.outputs.mode == 'signed'
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -Last 1
          if (-not $signtool) { throw "signtool.exe not found" }
          $files = @(Get-ChildItem release -Filter *.exe) + @(Get-ChildItem release -Recurse -Filter "Track Your Time.exe")
          foreach ($f in $files) {
            & $signtool.FullName verify /pa /v $f.FullName
            if ($LASTEXITCODE -ne 0) { throw "signtool verify failed for $($f.FullName)" }
          }

      # ── Checksums and upload ───────────────────────────────────────
      - name: Write checksums
        if: steps.signing.outputs.mode != 'skip'
        shell: bash
        run: |
          shopt -s nullglob
          cd release
          files=(*.dmg *.zip *.pkg *.exe *.appx *.AppImage *.deb *.rpm *.tar.gz *.snap)
          if [ ${#files[@]} -gt 0 ]; then
            if command -v sha256sum >/dev/null; then sha256sum "${files[@]}"; else shasum -a 256 "${files[@]}"; fi > SHA256SUMS-${{ matrix.channel }}.txt
            cat SHA256SUMS-${{ matrix.channel }}.txt
          fi

      - name: Upload artifacts
        if: steps.signing.outputs.mode != 'skip'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.channel }}-${{ steps.signing.outputs.mode }}
          path: |
            ${{ matrix.artifacts }}
            release/SHA256SUMS-${{ matrix.channel }}.txt
          # A Mac App Store build without its secrets writes no pkg.
          if-no-files-found: ${{ matrix.channel == 'mas' && steps.signing.outputs.mode == 'unsigned' && 'ignore' || 'error' }}

  # ── Draft GitHub Release (tags only) ─────────────────────────────────
  # Runs only when every leg succeeded. scripts/desktop-release-draft.mjs
  # decides what is attached (lib/desktop-release.mjs → releasePlan): signed
  # mac and win downloads, every Linux download, and each feed, after checking
  # that every file a feed names is attached with the sha512 and size it
  # states. `-unsigned` files and store packages are never attached; an
  # unsigned mac or win leg is a warning on the run, so the person publishing
  # sees which platform is missing. A release that is already published is
  # never touched: a new build needs a new tag.
  draft-release:
    name: draft release
    if: github.ref_type == 'tag'
    needs: [rollout, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
      # Normalised by the rollout job: a number from 0 to 99, or empty for
      # every install (100 is written as no key; scripts/lib/desktop-rollout.mjs).
      STAGING_PERCENTAGE: ${{ needs.rollout.outputs.percentage }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # For electron-updater's js-yaml, which reads the feeds as the app does.
      - name: Install deps
        run: pnpm install --frozen-lockfile --ignore-scripts

      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: artifacts

      # Writes stagingPercentage into each feed, then checks the rewritten
      # feeds against the attached files the same way as the originals.
      - name: Collect the release files
        run: node scripts/desktop-release-draft.mjs --artifacts artifacts --out release-files --staging-percentage "$STAGING_PERCENTAGE"

      - name: Refuse a release that is already published
        shell: bash
        run: |
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" != "true" ]; then
              echo "::error::$TAG is already published. Tag a new version instead of rebuilding a published release."
              exit 1
            fi
            echo "exists=true" >> "$GITHUB_ENV"
          fi

      - name: Create or update the draft
        shell: bash
        run: |
          set -euo pipefail
          version="${TAG#v}"
          if [ "${exists:-}" = "true" ]; then
            gh release upload "$TAG" release-files/* --clobber
          else
            printf 'Track Your Time %s.\n\nSee CHANGELOG.md for what changed. Publishing this release offers it to every installed copy that updates itself.\n' "$version" > notes.md
            gh release create "$TAG" release-files/* --draft --verify-tag --title "Track Your Time $version" --notes-file notes.md
          fi
          echo "Draft: $(gh release view "$TAG" --json url --jq .url)"
