name: Installed Desktop QA

# The Electron → Tauri migration on real machines (scripts/installed-desktop-qa.mjs):
# install an Electron release (0.3.0 or earlier), let electron-updater update it
# through the legacy feed a Tauri release publishes, then check the Tauri app is
# what is installed, in the same profile, and that it starts (its smoke mode).
# On Windows that includes the NSIS hook removing the Electron install.

on:
  workflow_dispatch:
    inputs:
      from:
        description: Installed Electron version (0.3.0 or earlier)
        default: "0.3.0"
        required: true
      to:
        description: Tauri version to update to (may still be a draft)
        required: true
      public_feed:
        description: Use the published GitHub feed instead of a loopback draft mirror
        type: boolean
        default: false
      source_run:
        description: Desktop Release run of the `to` tag (read-only fallback for draft assets)
        required: true

permissions:
  contents: read
  actions: read

jobs:
  installed:
    name: ${{ matrix.os }} installed update
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: [windows-2025, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ github.token }}
      QA_FROM: ${{ inputs.from }}
      QA_TO: ${{ inputs.to }}
      QA_PUBLIC_FEED: ${{ inputs.public_feed }}
      QA_SOURCE_RUN: ${{ inputs.source_run }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # The Electron app's libraries for the version being updated FROM, and
      # WebKitGTK for the Tauri one it becomes (an AppImage carries its own,
      # but the runner's are what a person's desktop has).
      - name: Use Ubuntu's own mirror when Azure's does not resolve
        # GitHub's runners list azure.archive.ubuntu.com first in apt's mirror file, and
        # apt does not move to the next mirror when a name fails to resolve. During an
        # Azure DNS outage (2026-11-11, hours) every package download failed.
        if: runner.os == 'Linux'
        run: |
          if ! getent hosts azure.archive.ubuntu.com >/dev/null && [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
            echo "azure.archive.ubuntu.com does not resolve; apt uses the next mirror"
          fi
      - name: Install Linux runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb dbus-x11 libgtk-3-0 libnss3 libgbm1 libasound2t64 libsecret-1-0 libnotify4 libwebkit2gtk-4.1-0 libayatana-appindicator3-1
      - name: Install released app and update it
        run: node scripts/installed-desktop-qa.mjs
      - name: Install released deb and rpm packages
        if: runner.os == 'Linux'
        run: node scripts/desktop-packages-smoke.mjs --dir test-results/installed-desktop/downloads/new
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: installed-desktop-${{ matrix.os }}-${{ inputs.public_feed && 'public' || 'draft' }}
          path: |
            test-results/installed-desktop/*.json
            test-results/installed-desktop/*.png
            test-results/installed-desktop/*.log
            test-results/linux-packages/
          if-no-files-found: warn
