[package]
name = "trackyourtime-desktop"
# Not the app's version: tauri.conf.json reads it from the root package.json,
# which is the one version (scripts/lib/version-sync.test.mjs).
version = "0.0.0"
description = "Track Your Time desktop app"
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
name = "trackyourtime_desktop"
path = "src/lib.rs"

[[bin]]
name = "trackyourtime-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tyt-wire = { path = "../crates/wire" }
tyt-model = { path = "../crates/model" }
tyt-activity = { path = "../crates/activity" }
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
aes-gcm = "0.10"
aes = "0.8"
cbc = "0.1"
pbkdf2 = "0.12"
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
rand = "0.8"
base64 = "0.22"
rusty-leveldb = "4.0.2"
tempfile = "3"
open = "5"
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSProcessInfo", "NSError", "NSString", "NSUserDefaults"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSDockTile", "NSRunningApplication", "NSWorkspace", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSControl", "NSView", "NSResponder", "NSFont", "NSFontDescriptor"] }
objc2-service-management = { version = "0.3", default-features = false, features = ["std", "SMAppService", "objc2", "objc2-foundation"] }

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.7"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security_Cryptography",
  "Win32_System_Memory",
  "Win32_System_StationsAndDesktops",
  "Win32_System_SystemInformation",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Storage_Packaging_Appx",
  "Win32_System_Registry",
] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
notify-rust = "4"
x11-dl = "2.21"
dbus = "0.9"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# The e2e control channel (src/e2e.rs). Never in a release build.
e2e = []
# A Mac App Store build: sandboxed, no self-update, no activity capture.
mas = []
