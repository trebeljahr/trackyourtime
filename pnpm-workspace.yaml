packages:
  - "packages/*"
  - "docs-site"
# `electron` is deliberately NOT listed: since Electron 42 the package has no
# install script at all. The binary is downloaded on first `require("electron")`
# (or by its `install-electron` bin), which `scripts/ensure-electron.mjs` runs
# explicitly for every desktop build and the CI desktop job.
allowBuilds:
  '@sentry/cli': true
  core-js: true
  core-js-pure: true
  electron-winstaller: true
  esbuild: true
  sharp: true
  unrs-resolver: true

# @raycast/api hard-depends on @types/react 19.0.10, so a second copy of the
# React types lands in the virtual store alongside the client's 19.2.14. pnpm
# then hoists ONE of them into node_modules/.pnpm/node_modules, and which one
# wins varies between installs. Next's own bundled .d.ts files resolve `react`
# from that hoisted directory, so when 19.0.10 wins they drag it into the
# client's type program next to 19.2.14 and every ReactNode becomes two
# incompatible types (TS2322 in components/ui/command.tsx). Forcing a single
# version keeps the hoist deterministic.
overrides:
  "@types/react": "^19.2.14"

# `pnpm deploy` — which packages/server/Dockerfile runs to materialise the
# production dependency closure at /prod — refuses to run from pnpm v10 onward
# unless the workspace opts in, and fails the image build outright with
# ERR_PNPM_DEPLOY_NONINJECTED_WORKSPACE. The two ways out are injected
# workspace packages, which changes how every workspace dependency is linked
# for everyone, or this, which changes nothing but `deploy` itself.
#
# It lives here rather than in .npmrc or as a --legacy flag on the command
# because pnpm-workspace.yaml is the only one of the three that both Dockerfiles
# already COPY into the build context.
forceLegacyDeploy: true
