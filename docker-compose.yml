# LEGACY single-app layout — one Coolify app running all four services.
#
# Superseded by docker-compose.server.yml + docker-compose.client.yml, which
# are what the deployment actually uses. This layout is kept for reference and
# because a project that has not been split can still deploy from it, but note
# that nothing routes /api to the `server` service under it: Coolify routes a
# dockercompose app by service name, and there is no single service here that
# serves both the web app and the API. That is why the sibling `streaks`
# deployment, which uses this exact file, answers 503.
#
# Coolify auto-detects ${VAR_NAME} syntax and creates UI fields for each.
# Do NOT expose ports here — Coolify's Traefik handles external routing.

services:
  server:
    image: ${SERVER_IMAGE:-ghcr.io/trebeljahr/trackyourtime-server:main}
    environment:
      PORT: "5159"
      MONGODB_URI: mongodb://mongo:27017/${DB_NAME:-app}
      REDIS_URL: redis://redis:6379
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      LISTMONK_URL: ${LISTMONK_URL:-}
      LISTMONK_API_USER: ${LISTMONK_API_USER:-}
      LISTMONK_API_TOKEN: ${LISTMONK_API_TOKEN:-}
      LISTMONK_FROM_EMAIL: ${LISTMONK_FROM_EMAIL:-}
      LISTMONK_FROM: ${LISTMONK_FROM:-}
      LISTMONK_LIVE_LIST_ID: ${LISTMONK_LIVE_LIST_ID:-}
      LISTMONK_TEST_LIST_ID: ${LISTMONK_TEST_LIST_ID:-}
      LISTMONK_TX_TEMPLATE_ID: ${LISTMONK_TX_TEMPLATE_ID:-}
      LISTMONK_CAMPAIGN_TEMPLATE_ID: ${LISTMONK_CAMPAIGN_TEMPLATE_ID:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    depends_on:
      - mongo
      - redis
    restart: unless-stopped

  client:
    image: ${CLIENT_IMAGE:-ghcr.io/trebeljahr/trackyourtime-client:main}
    environment:
      # Pin client port — Coolify's app-level PORT (set for the server)
      # would otherwise bleed into every service.
      PORT: "6477"
      # Deliberately NO NEXT_PUBLIC_* here: Next.js inlines those into
      # the browser bundle when the image is BUILT, so runtime env on
      # this prebuilt container cannot affect them. They are passed as
      # Docker build args in .github/workflows/build-and-deploy.yml.
    restart: unless-stopped

  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mongo-data:
