# Opt in explicitly. Read docs/timesheet-approvals.md before applying this to
# an existing volume. No ports are exposed; Mongo stays on the compose network.
# docker compose -f docker-compose.selfhost.yml -f docker-compose.selfhost.approvals.yml up -d
services:
  mongo:
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - >-
          try { rs.status(); }
          catch (error) {
            if (error.codeName !== 'NotYetInitialized') throw error;
            rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]});
          }
          if (!db.hello().isWritablePrimary) quit(1);
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s
  server:
    environment:
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/trackyourtime?replicaSet=rs0}
