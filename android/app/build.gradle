apply plugin: 'com.android.application'

// Release signing, driven entirely by the environment.
//
// Four inputs and nothing else: the keystore file at android/app/release.keystore
// plus KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD. .github/workflows/
// mobile-release.yml decodes ANDROID_KEYSTORE_BASE64 into that path and exports
// the other three from secrets; locally you copy the keystore in and export the
// three yourself. See docs/deploy.md → "Android release signing".
//
// Nothing about a key is committed: the file is gitignored (`*.keystore`,
// `*.jks`) and no password or alias appears in this file, which is what keeps
// the release key out of a repo that anyone can clone.
//
// When any of the four is missing the release build stays UNSIGNED rather than
// failing — a plain `./gradlew bundleRelease` on a fresh checkout has to work,
// and an unsigned bundle is the honest result of having no key. CI is where
// that must not pass silently, so mobile-release.yml checks the secrets are
// complete and then runs `jarsigner -verify` on the artifact; a missing secret
// fails the workflow instead of shipping an unsigned AAB with a green build.
def releaseKeystoreFile = file("release.keystore")
def releaseStorePassword = System.getenv("KEYSTORE_PASSWORD")
def releaseKeyAlias = System.getenv("KEY_ALIAS")
def releaseKeyPassword = System.getenv("KEY_PASSWORD")
def canSignRelease = releaseKeystoreFile.exists() &&
    releaseStorePassword && releaseKeyAlias && releaseKeyPassword
if (!canSignRelease) {
    logger.lifecycle(
        "trackyourtime: no release signing key (need android/app/release.keystore " +
        "plus KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD) — a release build " +
        "will be UNSIGNED and cannot be uploaded to Play."
    )
}

android {
    namespace = "com.ricoslabs.trackyourtime"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.ricoslabs.trackyourtime"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        // Kept in step with the root package.json by hand: `cap add` stamps the
        // template's own "1.0" here and `cap sync` never touches it again.
        // scripts/build-mobile.mjs asserts the two agree, the same way it does
        // for MARKETING_VERSION on iOS.
        versionName "0.1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (canSignRelease) {
            release {
                storeFile releaseKeystoreFile
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // Guarded by the same condition that created the config: naming a
            // `signingConfigs.release` that was never declared is an unhelpful
            // "Could not get unknown property" at configuration time, which
            // would break every task in the project and not only this one.
            if (canSignRelease) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
